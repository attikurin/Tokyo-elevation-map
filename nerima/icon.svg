<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>練馬区 高低マップ アイコン</title>
  <defs>
    <!-- 練馬の空（淡黄緑〜淡橙：農地と夕暮れ） -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed581"/>
      <stop offset="55%" stop-color="#dcedc8"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <!-- 武蔵野台地（練馬グリーン） -->
    <linearGradient id="terraceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <!-- 農地（キャベツ畑・練馬大根畑） -->
    <linearGradient id="farmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5e1a5"/>
      <stop offset="100%" stop-color="#9ccc65"/>
    </linearGradient>
    <!-- 白子川・石神井川 -->
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
    <!-- 石神井池の水面 -->
    <radialGradient id="pondGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b39ddb"/>
      <stop offset="100%" stop-color="#5e35b1"/>
    </radialGradient>
    <!-- 大泉アニメーションスタジオ（オレンジ） -->
    <linearGradient id="animeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#fb8c00"/>
    </linearGradient>
    <!-- 練馬大根（白〜薄緑） -->
    <linearGradient id="daikonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcedc8"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f8e9"/>
    </linearGradient>
    <!-- 鳥居（石神井氷川神社の朱） -->
    <linearGradient id="toriiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
  </defs>

  <!-- 背景：丸角矩形（武蔵野の空） -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#skyGrad)"/>

  <!-- 太陽 -->
  <circle cx="412" cy="112" r="44" fill="#fff" opacity="0.6"/>

  <!-- 武蔵野台地（背景・なだらかな丘） -->
  <path d="M 0 290 Q 80 275, 160 282 T 320 272 Q 400 268, 512 280 L 512 380 L 0 380 Z" fill="url(#terraceGrad)" opacity="0.92"/>

  <!-- 田柄川／中村川（暗渠の段差） -->
  <path d="M 0 314 L 512 314 L 512 320 L 0 320 Z" fill="#1b5e20" opacity="0.32"/>

  <!-- 農地（キャベツ畑・練馬大根畑のパッチワーク） -->
  <path d="M 0 350 Q 100 340, 200 352 T 400 346 Q 470 344, 512 354 L 512 410 L 0 410 Z" fill="url(#farmGrad)" opacity="0.95"/>

  <!-- 農地の畝（横ライン） -->
  <g opacity="0.4" stroke="#558b2f" stroke-width="1.2" fill="none">
    <line x1="0" y1="360" x2="512" y2="358"/>
    <line x1="0" y1="372" x2="512" y2="370"/>
    <line x1="0" y1="384" x2="512" y2="382"/>
    <line x1="0" y1="396" x2="512" y2="394"/>
  </g>

  <!-- 石神井川（北側の川） -->
  <path d="M 0 334 Q 80 328, 160 336 T 320 331 Q 400 328, 512 336" stroke="url(#riverGrad)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.92"/>
  <path d="M 0 334 Q 80 328, 160 336 T 320 331 Q 400 328, 512 336" stroke="#e1f5fe" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- 白子川（南側の川） -->
  <path d="M 0 388 Q 90 384, 180 390 T 360 386 Q 440 384, 512 390" stroke="url(#riverGrad)" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 0 388 Q 90 384, 180 390 T 360 386 Q 440 384, 512 390" stroke="#e1f5fe" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- 石神井公園 三宝寺池（左・神秘的な紫の水面） -->
  <g>
    <ellipse cx="98" cy="262" rx="42" ry="22" fill="url(#pondGrad)" opacity="0.92" stroke="#4527a0" stroke-width="1.5"/>
    <ellipse cx="98" cy="262" rx="42" ry="22" fill="none" stroke="#ede7f6" stroke-width="1" opacity="0.5"/>
    <!-- 池の波紋 -->
    <ellipse cx="98" cy="262" rx="20" ry="10" fill="none" stroke="#ede7f6" stroke-width="0.8" opacity="0.6"/>
    <!-- 池畔の木 -->
    <rect x="60" y="246" width="2" height="12" fill="#4e342e"/>
    <circle cx="61" cy="244" r="6" fill="#2e7d32" opacity="0.9"/>
    <rect x="140" y="248" width="2" height="10" fill="#4e342e"/>
    <circle cx="141" cy="246" r="5" fill="#388e3c" opacity="0.9"/>
    <!-- ラベル -->
    <text x="98" y="295" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="9" font-weight="700" fill="#4527a0">三宝寺池</text>
  </g>

  <!-- 練馬大根（中央のシンボル・大きな白い大根） -->
  <g>
    <!-- 葉（緑） -->
    <path d="M 256 168 Q 244 152, 240 138 Q 252 142, 258 155 Z" fill="#558b2f"/>
    <path d="M 256 168 Q 268 152, 272 138 Q 260 142, 254 155 Z" fill="#558b2f"/>
    <path d="M 256 168 Q 250 148, 246 130 Q 256 134, 258 152 Z" fill="#689f38"/>
    <path d="M 256 168 Q 262 148, 266 130 Q 256 134, 254 152 Z" fill="#689f38"/>
    <path d="M 256 168 Q 256 144, 256 124 Q 260 138, 256 158 Z" fill="#7cb342"/>
    <!-- 大根本体（細長く下にすぼまる） -->
    <path d="M 244 168 Q 240 220, 248 280 Q 252 312, 256 320 Q 260 312, 264 280 Q 272 220, 268 168 Z" fill="url(#daikonGrad)" stroke="#558b2f" stroke-width="1.5"/>
    <!-- 大根の縞 -->
    <line x1="246" y1="200" x2="266" y2="200" stroke="#c5e1a5" stroke-width="0.8" opacity="0.7"/>
    <line x1="247" y1="225" x2="265" y2="225" stroke="#c5e1a5" stroke-width="0.8" opacity="0.7"/>
    <line x1="248" y1="250" x2="264" y2="250" stroke="#c5e1a5" stroke-width="0.8" opacity="0.7"/>
    <line x1="250" y1="275" x2="262" y2="275" stroke="#c5e1a5" stroke-width="0.8" opacity="0.7"/>
    <line x1="251" y1="298" x2="261" y2="298" stroke="#c5e1a5" stroke-width="0.8" opacity="0.7"/>
    <!-- 髭根 -->
    <line x1="256" y1="320" x2="254" y2="332" stroke="#bdbdbd" stroke-width="1"/>
    <line x1="256" y1="320" x2="258" y2="334" stroke="#bdbdbd" stroke-width="1"/>
    <line x1="256" y1="320" x2="252" y2="328" stroke="#bdbdbd" stroke-width="0.8"/>
    <!-- ラベル -->
    <rect x="232" y="338" width="48" height="14" rx="2" fill="#fff" stroke="#43a047" stroke-width="1"/>
    <text x="256" y="349" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="9" font-weight="700" fill="#43a047">練馬大根</text>
  </g>

  <!-- 東映アニメーション大泉スタジオ（右側・オレンジ建物） -->
  <g>
    <!-- 建物本体 -->
    <rect x="362" y="222" width="86" height="88" rx="3" fill="url(#animeGrad)" opacity="0.95"/>
    <!-- 屋根 -->
    <rect x="358" y="218" width="94" height="8" fill="#e65100"/>
    <!-- 窓 -->
    <rect x="370" y="234" width="10" height="10" fill="#fff3e0" opacity="0.9"/>
    <rect x="386" y="234" width="10" height="10" fill="#fff3e0" opacity="0.9"/>
    <rect x="402" y="234" width="10" height="10" fill="#fff3e0" opacity="0.9"/>
    <rect x="418" y="234" width="10" height="10" fill="#fff3e0" opacity="0.9"/>
    <rect x="434" y="234" width="10" height="10" fill="#fff3e0" opacity="0.9"/>
    <rect x="370" y="250" width="10" height="10" fill="#fff3e0" opacity="0.75"/>
    <rect x="386" y="250" width="10" height="10" fill="#fff3e0" opacity="0.75"/>
    <rect x="402" y="250" width="10" height="10" fill="#fff3e0" opacity="0.75"/>
    <rect x="418" y="250" width="10" height="10" fill="#fff3e0" opacity="0.75"/>
    <rect x="434" y="250" width="10" height="10" fill="#fff3e0" opacity="0.75"/>
    <!-- アニメフィルムのリール（屋上のシンボル） -->
    <circle cx="405" cy="208" r="9" fill="#e65100" stroke="#fff" stroke-width="1.5"/>
    <circle cx="405" cy="208" r="3" fill="#fff"/>
    <circle cx="400" cy="204" r="1.5" fill="#fff"/>
    <circle cx="410" cy="204" r="1.5" fill="#fff"/>
    <circle cx="400" cy="212" r="1.5" fill="#fff"/>
    <circle cx="410" cy="212" r="1.5" fill="#fff"/>
    <!-- 看板 -->
    <rect x="368" y="278" width="74" height="22" rx="2" fill="#fff8e1" stroke="#e65100" stroke-width="1.5"/>
    <text x="405" y="294" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="700" fill="#e65100">アニメ大泉</text>
  </g>

  <!-- 石神井氷川神社の朱鳥居（左下・三宝寺池北） -->
  <g>
    <!-- 笠木 -->
    <rect x="44" y="350" width="78" height="6" fill="url(#toriiGrad)"/>
    <!-- 島木 -->
    <rect x="50" y="356" width="66" height="4" fill="#8d1414"/>
    <!-- 貫 -->
    <rect x="54" y="372" width="58" height="5" fill="url(#toriiGrad)"/>
    <!-- 左柱 -->
    <rect x="56" y="350" width="7" height="40" fill="url(#toriiGrad)"/>
    <!-- 右柱 -->
    <rect x="103" y="350" width="7" height="40" fill="url(#toriiGrad)"/>
    <!-- 額束 -->
    <rect x="78" y="358" width="10" height="12" fill="#fff8e1" stroke="#b71c1c" stroke-width="0.8"/>
    <text x="83" y="368" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="8" font-weight="700" fill="#b71c1c">氷</text>
  </g>

  <!-- 桜並木（石神井川沿いの桜） -->
  <g>
    <rect x="178" y="370" width="3" height="18" fill="#4e342e"/>
    <circle cx="179.5" cy="368" r="8" fill="#f8bbd0" opacity="0.92"/>
    <circle cx="174" cy="365" r="5" fill="#f48fb1" opacity="0.85"/>
    <circle cx="185" cy="365" r="5" fill="#fce4ec" opacity="0.85"/>

    <rect x="320" y="370" width="3" height="18" fill="#4e342e"/>
    <circle cx="321.5" cy="368" r="8" fill="#f8bbd0" opacity="0.92"/>
    <circle cx="316" cy="365" r="5" fill="#fce4ec" opacity="0.85"/>
    <circle cx="327" cy="365" r="5" fill="#f48fb1" opacity="0.85"/>
  </g>

  <!-- 光が丘公園の樹冠（左奥・大きな樹） -->
  <g>
    <rect x="148" y="232" width="4" height="38" fill="#4e342e"/>
    <circle cx="150" cy="222" r="22" fill="#388e3c" opacity="0.92"/>
    <circle cx="140" cy="216" r="14" fill="#43a047" opacity="0.85"/>
    <circle cx="160" cy="216" r="14" fill="#2e7d32" opacity="0.88"/>
    <circle cx="150" cy="208" r="12" fill="#66bb6a" opacity="0.85"/>
  </g>

  <!-- 「練馬」バッジ（右下） -->
  <g>
    <circle cx="430" cy="442" r="50" fill="#43a047" stroke="#fff" stroke-width="4"/>
    <text x="430" y="437" text-anchor="middle" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">練馬</text>
    <text x="430" y="464" text-anchor="middle" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="11" font-weight="500" fill="#fff" letter-spacing="1">高低マップ</text>
  </g>

  <!-- 等高線アクセント（右上・武蔵野台地の地形メタファー） -->
  <g opacity="0.4" fill="none" stroke="#2e7d32" stroke-width="1.5">
    <path d="M 280 90 Q 320 75, 360 90 T 460 90"/>
    <path d="M 290 110 Q 325 98, 360 110 T 450 110"/>
    <path d="M 300 130 Q 330 120, 360 130 T 440 130"/>
  </g>

  <!-- 葉っぱの前景アクセント -->
  <g opacity="0.85">
    <path d="M 178 152 Q 184 144, 188 152 Q 190 162, 180 162 Q 172 158, 178 152 Z" fill="#7cb342"/>
    <path d="M 366 178 Q 372 170, 376 180 Q 376 188, 366 188 Q 360 184, 366 178 Z" fill="#aed581"/>
    <ellipse cx="120" cy="180" rx="6" ry="3" fill="#9ccc65" transform="rotate(-25 120 180)"/>
    <ellipse cx="80" cy="200" rx="5" ry="3" fill="#c5e1a5" transform="rotate(20 80 200)"/>
  </g>
</svg>
