<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>三鷹市 高低マップ アイコン</title>
  <defs>
    <!-- 三鷹の空（ジブリ夕焼け：深緑〜赤レンガ〜天文台パープル） -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4527a0"/>
      <stop offset="40%" stop-color="#7e57c2"/>
      <stop offset="75%" stop-color="#ffab91"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <!-- 武蔵野台地（ジブリ森林グリーン） -->
    <linearGradient id="terraceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <!-- 国分寺崖線（深い森・湧水の壁） -->
    <linearGradient id="cliffGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <!-- 野川の谷（湧水・カワセミの川） -->
    <linearGradient id="valleyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <!-- 野川・玉川上水・仙川 -->
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <!-- 井の頭池（神田川源流） -->
    <radialGradient id="pondGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b3e5fc"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </radialGradient>
    <!-- ジブリ美術館（赤レンガ） -->
    <linearGradient id="ghibliGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <!-- 国立天文台ドーム（白〜銀） -->
    <radialGradient id="domeGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eeeeee"/>
      <stop offset="100%" stop-color="#9e9e9e"/>
    </radialGradient>
  </defs>

  <!-- 背景：丸角矩形（ジブリ夕暮れの空） -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#skyGrad)"/>

  <!-- 星（天文台らしさ） -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="80" cy="60" r="2"/>
    <circle cx="160" cy="40" r="1.5"/>
    <circle cx="220" cy="80" r="2"/>
    <circle cx="60" cy="120" r="1.5"/>
    <circle cx="140" cy="110" r="2"/>
    <circle cx="200" cy="50" r="1.2"/>
    <circle cx="100" cy="90" r="1.8"/>
  </g>
  <!-- 月（赤レンガ色：夕焼け月） -->
  <circle cx="412" cy="100" r="40" fill="#fff" opacity="0.65"/>
  <circle cx="420" cy="108" r="36" fill="url(#skyGrad)" opacity="0.18"/>

  <!-- 武蔵野台地（背景・なだらかな丘） -->
  <path d="M 0 285 Q 80 270, 160 278 T 320 268 Q 400 264, 512 278 L 512 372 L 0 372 Z" fill="url(#terraceGrad)" opacity="0.92"/>

  <!-- 国分寺崖線（市南部の段差・濃緑のシルエット） -->
  <path d="M 0 310 Q 100 304, 200 312 T 400 308 Q 470 306, 512 314 L 512 322 L 0 322 Z" fill="url(#cliffGrad)" opacity="0.55"/>
  <path d="M 0 315 L 512 315 L 512 320 L 0 320 Z" fill="#1b5e20" opacity="0.4"/>

  <!-- 野川の谷（崖線下の低地） -->
  <path d="M 0 348 Q 100 338, 200 350 T 400 344 Q 470 342, 512 352 L 512 410 L 0 410 Z" fill="url(#valleyGrad)" opacity="0.95"/>

  <!-- 玉川上水（北側・上水・桜並木とともに） -->
  <path d="M 0 333 Q 80 328, 160 335 T 320 330 Q 400 328, 512 335" stroke="url(#riverGrad)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.92"/>
  <path d="M 0 333 Q 80 328, 160 335 T 320 330 Q 400 328, 512 335" stroke="#e1f5fe" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- 野川（南側の川・国分寺崖線の湧水） -->
  <path d="M 0 390 Q 90 386, 180 392 T 360 388 Q 440 386, 512 392" stroke="url(#riverGrad)" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.92"/>
  <path d="M 0 390 Q 90 386, 180 392 T 360 388 Q 440 386, 512 392" stroke="#e1f5fe" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- 井の頭池（右上方・神田川源流・市境を跨ぐ） -->
  <g>
    <ellipse cx="410" cy="252" rx="38" ry="20" fill="url(#pondGrad)" opacity="0.92" stroke="#01579b" stroke-width="1.5"/>
    <ellipse cx="410" cy="252" rx="18" ry="9" fill="none" stroke="#e1f5fe" stroke-width="1" opacity="0.6"/>
    <!-- 七井橋 -->
    <rect x="395" y="248" width="30" height="3" fill="#5d4037" opacity="0.9"/>
    <!-- 弁天堂 -->
    <rect x="380" y="240" width="8" height="10" fill="#c62828"/>
    <polygon points="378,240 388,232 392,240" fill="#b71c1c"/>
    <!-- ラベル -->
    <text x="410" y="284" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="9" font-weight="700" fill="#01579b">井の頭池</text>
  </g>

  <!-- 三鷹の森ジブリ美術館（中央・赤レンガ建物） -->
  <g>
    <!-- 建物本体（やや有機的な形・台形＋曲線屋根） -->
    <path d="M 200 218 L 296 218 L 304 312 L 192 312 Z" fill="url(#ghibliGrad)" stroke="#8b0000" stroke-width="1.5"/>
    <!-- 屋根（緑屋根・自然と調和） -->
    <path d="M 196 218 Q 248 195, 300 218 L 300 230 Q 248 210, 196 230 Z" fill="#2e7d32"/>
    <!-- 屋上の樹（屋上庭園のメタファー） -->
    <rect x="244" y="196" width="2" height="10" fill="#4e342e"/>
    <circle cx="245" cy="194" r="6" fill="#388e3c"/>
    <circle cx="240" cy="196" r="4" fill="#43a047"/>
    <circle cx="250" cy="196" r="4" fill="#2e7d32"/>
    <!-- 円形窓（ジブリらしさ） -->
    <circle cx="220" cy="245" r="8" fill="#fff8e1" stroke="#8b0000" stroke-width="1.2"/>
    <circle cx="220" cy="245" r="4" fill="#fff176" opacity="0.8"/>
    <circle cx="276" cy="245" r="8" fill="#fff8e1" stroke="#8b0000" stroke-width="1.2"/>
    <circle cx="276" cy="245" r="4" fill="#fff176" opacity="0.8"/>
    <!-- 正方形窓（下段） -->
    <rect x="210" y="265" width="10" height="14" fill="#fff8e1" stroke="#8b0000" stroke-width="0.8"/>
    <rect x="226" y="265" width="10" height="14" fill="#fff8e1" stroke="#8b0000" stroke-width="0.8"/>
    <rect x="242" y="265" width="10" height="14" fill="#fff8e1" stroke="#8b0000" stroke-width="0.8"/>
    <rect x="258" y="265" width="10" height="14" fill="#fff8e1" stroke="#8b0000" stroke-width="0.8"/>
    <rect x="274" y="265" width="10" height="14" fill="#fff8e1" stroke="#8b0000" stroke-width="0.8"/>
    <!-- 入口・看板 -->
    <rect x="232" y="290" width="32" height="22" fill="#4e342e"/>
    <rect x="216" y="298" width="64" height="16" rx="2" fill="#fff8e1" stroke="#8b0000" stroke-width="1.5"/>
    <text x="248" y="310" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="700" fill="#8b0000">ジブリ美術館</text>
  </g>

  <!-- 国立天文台ドーム（左側・大沢・大型望遠鏡ドーム） -->
  <g>
    <!-- 基礎 -->
    <rect x="76" y="270" width="76" height="40" fill="#9e9e9e" opacity="0.92"/>
    <rect x="76" y="270" width="76" height="6" fill="#616161"/>
    <!-- ドーム本体（半球） -->
    <path d="M 76 270 A 38 38 0 0 1 152 270 Z" fill="url(#domeGrad)" stroke="#616161" stroke-width="1.5"/>
    <!-- ドームスリット（観測窓） -->
    <path d="M 110 234 L 118 234 L 116 268 L 112 268 Z" fill="#1a237e" opacity="0.85"/>
    <!-- ドームの継ぎ目 -->
    <path d="M 76 270 A 38 38 0 0 1 152 270" fill="none" stroke="#9e9e9e" stroke-width="0.8" opacity="0.6"/>
    <line x1="92" y1="246" x2="96" y2="270" stroke="#9e9e9e" stroke-width="0.6" opacity="0.5"/>
    <line x1="132" y1="246" x2="136" y2="270" stroke="#9e9e9e" stroke-width="0.6" opacity="0.5"/>
    <!-- 看板 -->
    <rect x="80" y="288" width="68" height="16" rx="2" fill="#fff8e1" stroke="#4527a0" stroke-width="1.2"/>
    <text x="114" y="300" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="9" font-weight="700" fill="#4527a0">国立天文台</text>
  </g>

  <!-- 望遠鏡からの光（星明かりの軌跡） -->
  <g opacity="0.5" stroke="#ffeb3b" stroke-width="1.2" fill="none">
    <line x1="114" y1="240" x2="160" y2="180"/>
    <line x1="114" y1="240" x2="170" y2="190"/>
  </g>

  <!-- ICU 国際基督教大学（左下・小さなチャペル風建物） -->
  <g>
    <!-- 建物 -->
    <rect x="40" y="332" width="36" height="32" fill="#fafafa" stroke="#4527a0" stroke-width="1"/>
    <!-- 屋根（三角） -->
    <polygon points="38,332 58,316 78,332" fill="#4527a0"/>
    <!-- 十字 -->
    <rect x="56" y="320" width="4" height="10" fill="#fff"/>
    <rect x="52" y="323" width="12" height="3" fill="#fff"/>
    <!-- 窓 -->
    <rect x="46" y="342" width="4" height="8" fill="#b3e5fc" opacity="0.85"/>
    <rect x="56" y="342" width="4" height="8" fill="#b3e5fc" opacity="0.85"/>
    <rect x="66" y="342" width="4" height="8" fill="#b3e5fc" opacity="0.85"/>
    <!-- ラベル -->
    <text x="58" y="375" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="8" font-weight="700" fill="#4527a0">ICU</text>
  </g>

  <!-- 太宰治・禅林寺の鳥居（右下・赤い小鳥居） -->
  <g>
    <!-- 笠木 -->
    <rect x="334" y="346" width="56" height="5" fill="#c62828"/>
    <!-- 島木 -->
    <rect x="338" y="351" width="48" height="3" fill="#8d1414"/>
    <!-- 貫 -->
    <rect x="342" y="366" width="40" height="4" fill="#c62828"/>
    <!-- 左柱 -->
    <rect x="344" y="346" width="5" height="36" fill="#c62828"/>
    <!-- 右柱 -->
    <rect x="375" y="346" width="5" height="36" fill="#c62828"/>
    <!-- 額束 -->
    <rect x="358" y="354" width="8" height="10" fill="#fff8e1" stroke="#8d1414" stroke-width="0.6"/>
    <text x="362" y="362" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="6" font-weight="700" fill="#8d1414">禅</text>
  </g>

  <!-- 桜並木（玉川上水沿いの桜） -->
  <g>
    <rect x="178" y="368" width="3" height="16" fill="#4e342e"/>
    <circle cx="179.5" cy="366" r="7" fill="#f8bbd0" opacity="0.92"/>
    <circle cx="174" cy="364" r="4" fill="#f48fb1" opacity="0.85"/>
    <circle cx="185" cy="364" r="4" fill="#fce4ec" opacity="0.85"/>

    <rect x="300" y="368" width="3" height="16" fill="#4e342e"/>
    <circle cx="301.5" cy="366" r="7" fill="#f8bbd0" opacity="0.92"/>
    <circle cx="296" cy="364" r="4" fill="#fce4ec" opacity="0.85"/>
    <circle cx="307" cy="364" r="4" fill="#f48fb1" opacity="0.85"/>
  </g>

  <!-- 国分寺崖線の樹冠（左奥・大きな樹） -->
  <g>
    <rect x="148" y="248" width="4" height="34" fill="#4e342e" opacity="0.7"/>
    <circle cx="150" cy="240" r="18" fill="#388e3c" opacity="0.88"/>
    <circle cx="142" cy="234" r="12" fill="#43a047" opacity="0.82"/>
    <circle cx="158" cy="234" r="12" fill="#2e7d32" opacity="0.85"/>
    <circle cx="150" cy="226" r="10" fill="#66bb6a" opacity="0.82"/>
  </g>

  <!-- 「三鷹」バッジ（右下） -->
  <g>
    <circle cx="430" cy="442" r="50" fill="#1b5e20" stroke="#fff" stroke-width="4"/>
    <text x="430" y="437" text-anchor="middle" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">三鷹</text>
    <text x="430" y="464" text-anchor="middle" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="11" font-weight="500" fill="#fff" letter-spacing="1">高低マップ</text>
  </g>

  <!-- 等高線アクセント（右上・武蔵野台地と国分寺崖線の地形メタファー） -->
  <g opacity="0.4" fill="none" stroke="#1b5e20" stroke-width="1.5">
    <path d="M 280 150 Q 320 138, 360 150 T 460 150"/>
    <path d="M 290 168 Q 325 156, 360 168 T 450 168"/>
    <path d="M 300 186 Q 330 176, 360 186 T 440 186"/>
  </g>

  <!-- ジブリの森の精霊（前景の小さな光・トトロ風の白い玉） -->
  <g opacity="0.9">
    <circle cx="110" cy="380" r="3" fill="#fff8e1"/>
    <circle cx="110" cy="380" r="1.5" fill="#fff"/>
    <circle cx="250" cy="385" r="2.5" fill="#fff8e1"/>
    <circle cx="350" cy="395" r="3" fill="#fff8e1"/>
    <circle cx="350" cy="395" r="1.5" fill="#fff"/>
    <!-- 葉っぱ -->
    <path d="M 90 170 Q 96 162, 100 172 Q 100 180, 90 180 Q 84 176, 90 170 Z" fill="#7cb342" opacity="0.8"/>
    <ellipse cx="170" cy="200" rx="5" ry="3" fill="#aed581" transform="rotate(-25 170 200)" opacity="0.8"/>
  </g>
</svg>
