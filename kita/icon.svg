<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景: 桜貝色クリーム -->
  <rect width="512" height="512" rx="96" fill="#fce4ec"/>

  <!-- 荒川／隅田川（区を囲む川・北東を流れる） -->
  <path d="M0,96 Q140,68 280,108 T512,86 L512,158 Q360,188 220,158 T0,170 Z" fill="#90caf9" opacity="0.75"/>
  <!-- 川面のハイライト -->
  <path d="M40,118 Q180,98 320,128 T500,118" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- 岩淵水門（赤水門・1924年・荒川／隅田川分岐） -->
  <g transform="translate(420,108)">
    <rect x="-18" y="-22" width="36" height="44" fill="#c62828" stroke="#8b0000" stroke-width="2"/>
    <rect x="-22" y="-26" width="44" height="6" fill="#8b0000"/>
    <line x1="-18" y1="-10" x2="18" y2="-10" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="-18" y1="4" x2="18" y2="4" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- 武蔵野台地北東端（飛鳥山台地・西側） -->
  <path d="M0,260 Q60,210 130,220 Q200,232 240,260 L240,420 L0,420 Z" fill="#a5d6a7" opacity="0.55"/>
  <!-- 等高線 -->
  <path d="M0,280 Q70,238 140,248 Q200,260 230,280" stroke="#43a047" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M0,310 Q70,275 140,283 Q200,292 230,310" stroke="#43a047" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- 音無川（石神井川下流・台地から低地へ流下） -->
  <path d="M30,250 Q120,275 200,290 Q300,305 420,300" stroke="#5e35b1" stroke-width="6" fill="none" opacity="0.65" stroke-linecap="round"/>
  <path d="M30,250 Q120,275 200,290 Q300,305 420,300" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.55"/>

  <!-- 飛鳥山桜（徳川吉宗1737年・東京最古の桜名所・左上の台地に咲く） -->
  <g transform="translate(95,235)">
    <!-- 枝 -->
    <path d="M0,30 L0,-10 M0,0 L-18,-18 M0,0 L18,-18 M0,-10 L-10,-30 M0,-10 L10,-30" stroke="#5d4037" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 桜の花群 -->
    <circle cx="-22" cy="-22" r="13" fill="#f8bbd0"/>
    <circle cx="22" cy="-22" r="13" fill="#f8bbd0"/>
    <circle cx="-12" cy="-34" r="12" fill="#f48fb1"/>
    <circle cx="12" cy="-34" r="12" fill="#f48fb1"/>
    <circle cx="0" cy="-44" r="14" fill="#ec407a"/>
    <!-- 花びら -->
    <g fill="#d81b60">
      <circle cx="-22" cy="-22" r="3"/>
      <circle cx="22" cy="-22" r="3"/>
      <circle cx="0" cy="-44" r="3"/>
    </g>
  </g>

  <!-- 都電荒川線レール（飛鳥山〜王子・区を東西に横断） -->
  <line x1="20" y1="362" x2="400" y2="362" stroke="#666" stroke-width="2.5"/>
  <line x1="20" y1="374" x2="400" y2="374" stroke="#666" stroke-width="2.5"/>
  <g stroke="#5d4037" stroke-width="2">
    <line x1="40" y1="360" x2="40" y2="376"/>
    <line x1="90" y1="360" x2="90" y2="376"/>
    <line x1="140" y1="360" x2="140" y2="376"/>
    <line x1="190" y1="360" x2="190" y2="376"/>
    <line x1="240" y1="360" x2="240" y2="376"/>
    <line x1="290" y1="360" x2="290" y2="376"/>
    <line x1="340" y1="360" x2="340" y2="376"/>
    <line x1="390" y1="360" x2="390" y2="376"/>
  </g>

  <!-- 都電車両（飛鳥山色・桜ピンク9000形） -->
  <g>
    <rect x="160" y="315" width="158" height="48" rx="10" fill="#d81b60" stroke="#880e4f" stroke-width="3"/>
    <rect x="308" y="322" width="14" height="38" rx="3" fill="#1976d2"/>
    <rect x="170" y="324" width="22" height="20" rx="2" fill="#e3f2fd"/>
    <rect x="198" y="324" width="22" height="20" rx="2" fill="#e3f2fd"/>
    <rect x="226" y="324" width="22" height="20" rx="2" fill="#e3f2fd"/>
    <rect x="254" y="324" width="22" height="20" rx="2" fill="#e3f2fd"/>
    <rect x="282" y="324" width="22" height="20" rx="2" fill="#e3f2fd"/>
    <rect x="160" y="348" width="158" height="5" fill="#fbc02d"/>
    <circle cx="182" cy="368" r="9" fill="#333"/>
    <circle cx="296" cy="368" r="9" fill="#333"/>
    <path d="M222,315 L212,300 L252,300 L242,315" stroke="#444" stroke-width="2" fill="none"/>
  </g>

  <!-- 王子稲荷の狐（右下・関東稲荷総司・狐の行列） -->
  <g transform="translate(395,388)">
    <!-- 顔 -->
    <ellipse cx="0" cy="0" rx="28" ry="26" fill="#ffffff" stroke="#43a047" stroke-width="3"/>
    <!-- 耳 -->
    <path d="M-22,-18 L-30,-44 L-10,-26 Z" fill="#ffffff" stroke="#43a047" stroke-width="2.5"/>
    <path d="M22,-18 L30,-44 L10,-26 Z" fill="#ffffff" stroke="#43a047" stroke-width="2.5"/>
    <path d="M-26,-22 L-28,-38 L-14,-28 Z" fill="#ec407a"/>
    <path d="M26,-22 L28,-38 L14,-28 Z" fill="#ec407a"/>
    <!-- 目 -->
    <ellipse cx="-9" cy="-3" rx="3" ry="5" fill="#1a1a1a"/>
    <ellipse cx="9" cy="-3" rx="3" ry="5" fill="#1a1a1a"/>
    <!-- 鼻 -->
    <path d="M0,5 L-4,12 L4,12 Z" fill="#43a047"/>
    <!-- ヒゲ -->
    <line x1="-12" y1="8" x2="-22" y2="6" stroke="#888" stroke-width="1"/>
    <line x1="-12" y1="12" x2="-22" y2="14" stroke="#888" stroke-width="1"/>
    <line x1="12" y1="8" x2="22" y2="6" stroke="#888" stroke-width="1"/>
    <line x1="12" y1="12" x2="22" y2="14" stroke="#888" stroke-width="1"/>
  </g>

  <!-- 北区役所ピン（中央・王子本町1-15-22） -->
  <g transform="translate(240,420)">
    <path d="M0,0 C-16,-30 -16,-50 0,-50 C16,-50 16,-30 0,0 Z" fill="#4a148c" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="-32" r="10" fill="#ffffff"/>
    <text x="0" y="-28" text-anchor="middle" font-size="13" fill="#4a148c" font-weight="900" font-family="sans-serif">北</text>
  </g>

  <!-- タイトル帯 -->
  <rect x="24" y="446" width="464" height="50" rx="14" fill="#4a148c" opacity="0.94"/>
  <text x="256" y="478" text-anchor="middle" font-family="'M PLUS Rounded 1c','Hiragino Sans',sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="2">北 高低</text>
  <text x="256" y="494" text-anchor="middle" font-family="'M PLUS Rounded 1c',sans-serif" font-size="10" font-weight="600" fill="#fce4ec" letter-spacing="3">ASUKAYAMA・OJI・OTONASHI</text>
</svg>
