<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 空：多摩川夕焼け（青→朱→紫） -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#01579b"/>
      <stop offset="40%" stop-color="#0277bd"/>
      <stop offset="75%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <!-- 武蔵野台地（市北部・狛江通り台地） -->
    <linearGradient id="terraceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <!-- 国分寺崖線（武蔵野台地南端の縁） -->
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#558b2f"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <!-- 多摩川（市の南側全域） -->
    <linearGradient id="tamaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#0277bd"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <!-- 野川（市北部の小流） -->
    <linearGradient id="nogawaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <!-- 弁財天池（泉龍寺・狛江市名起源） -->
    <radialGradient id="pondGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b3e5fc"/>
      <stop offset="70%" stop-color="#039be5"/>
      <stop offset="100%" stop-color="#01579b"/>
    </radialGradient>
    <!-- 伊豆美神社の朱（鳥居） -->
    <linearGradient id="toriiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6f00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>
    <!-- 亀塚古墳（帆立貝形） -->
    <linearGradient id="kofunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="60%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <!-- エコルマ・小田急ロマンスカー赤 -->
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <!-- 月（多摩川に映る） -->
    <radialGradient id="moonGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="80%" stop-color="#fff176"/>
      <stop offset="100%" stop-color="#fbc02d" stop-opacity="0.6"/>
    </radialGradient>
    <!-- 古墳パープル（狛江百塚） -->
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ce93d8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6a1b9a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景：夕焼け空 -->
  <rect x="0" y="0" width="512" height="512" rx="80" ry="80" fill="url(#skyGrad)"/>

  <!-- 星々 -->
  <circle cx="80" cy="60" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="140" cy="40" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="220" cy="55" r="2.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="320" cy="35" r="1.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="420" cy="65" r="2" fill="#ffffff" opacity="0.85"/>
  <circle cx="460" cy="100" r="1.3" fill="#ffffff" opacity="0.6"/>
  <circle cx="50" cy="120" r="1.5" fill="#ffffff" opacity="0.7"/>

  <!-- 月（多摩川に映る象徴） -->
  <circle cx="395" cy="95" r="34" fill="url(#moonGrad)"/>
  <circle cx="405" cy="88" r="5" fill="#fff9c4" opacity="0.45"/>
  <circle cx="388" cy="103" r="3" fill="#fff9c4" opacity="0.35"/>

  <!-- 古墳パープルグロー（狛江百塚の余韻） -->
  <circle cx="256" cy="280" r="180" fill="url(#purpleGlow)"/>

  <!-- 武蔵野台地（市北部の台地・狛江通り北側） -->
  <path d="M 0,235 Q 100,225 180,232 Q 280,238 380,228 Q 460,222 512,232 L 512,290 L 0,290 Z" fill="url(#terraceGrad)"/>

  <!-- 国分寺崖線（武蔵野台地南端・はけの斜面） -->
  <path d="M 0,290 Q 100,295 200,303 Q 320,312 420,305 Q 470,300 512,305 L 512,335 L 0,335 Z" fill="url(#cliffGrad)"/>

  <!-- 野川（市北部・武蔵野台地と崖線の間を流れる） -->
  <path d="M 30,275 Q 130,280 220,272 Q 320,268 410,278 Q 470,282 512,278" stroke="url(#nogawaGrad)" stroke-width="4" fill="none" opacity="0.9"/>
  <path d="M 30,275 Q 130,280 220,272 Q 320,268 410,278 Q 470,282 512,278" stroke="#b3e5fc" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- 多摩川（市南部・東西に大きく） -->
  <path d="M 0,395 Q 80,385 180,395 Q 280,405 380,392 Q 460,386 512,395 L 512,475 Q 460,470 380,475 Q 280,485 180,478 Q 80,470 0,478 Z" fill="url(#tamaGrad)"/>
  
  <!-- 多摩川の波紋（光の反射） -->
  <path d="M 60,420 Q 100,415 140,420" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.55"/>
  <path d="M 180,445 Q 220,440 260,445" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.55"/>
  <path d="M 320,425 Q 360,420 400,425" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.55"/>
  <path d="M 430,455 Q 460,450 490,455" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.45"/>

  <!-- 六郷用水跡（江戸時代の用水・市内を東西に） -->
  <path d="M 40,360 Q 150,358 260,362 Q 380,365 480,360" stroke="#b3e5fc" stroke-width="2" fill="none" opacity="0.7" stroke-dasharray="6,4"/>

  <!-- 多摩川五本松（猪方・狛江を代表する景観） -->
  <g transform="translate(80,330)">
    <!-- 松の幹 -->
    <rect x="-2" y="20" width="4" height="40" fill="#4e342e"/>
    <!-- 松葉（5本セットなので5つ並列で表現） -->
    <ellipse cx="0" cy="15" rx="14" ry="18" fill="#2e7d32"/>
    <ellipse cx="-2" cy="8" rx="9" ry="11" fill="#388e3c"/>
  </g>
  <g transform="translate(120,335)">
    <rect x="-2" y="18" width="4" height="38" fill="#4e342e"/>
    <ellipse cx="0" cy="13" rx="13" ry="17" fill="#2e7d32"/>
    <ellipse cx="-1" cy="6" rx="8" ry="10" fill="#388e3c"/>
  </g>
  <g transform="translate(160,332)">
    <rect x="-2" y="20" width="4" height="42" fill="#4e342e"/>
    <ellipse cx="0" cy="15" rx="15" ry="19" fill="#2e7d32"/>
    <ellipse cx="0" cy="7" rx="10" ry="12" fill="#388e3c"/>
  </g>
  <g transform="translate(200,338)">
    <rect x="-2" y="17" width="4" height="36" fill="#4e342e"/>
    <ellipse cx="0" cy="12" rx="12" ry="16" fill="#2e7d32"/>
    <ellipse cx="0" cy="5" rx="8" ry="10" fill="#388e3c"/>
  </g>
  <g transform="translate(238,334)">
    <rect x="-2" y="19" width="4" height="40" fill="#4e342e"/>
    <ellipse cx="0" cy="14" rx="14" ry="18" fill="#2e7d32"/>
    <ellipse cx="0" cy="6" rx="9" ry="11" fill="#388e3c"/>
  </g>

  <!-- 亀塚古墳（帆立貝形古墳・狛江百塚の象徴） -->
  <g transform="translate(330,330)">
    <!-- 円墳部分 -->
    <ellipse cx="0" cy="20" rx="28" ry="14" fill="url(#kofunGrad)"/>
    <ellipse cx="0" cy="18" rx="24" ry="10" fill="#6d4c41" opacity="0.55"/>
    <!-- 帆立貝の前方部 -->
    <path d="M -10,30 L -16,52 L 16,52 L 10,30 Z" fill="url(#kofunGrad)"/>
    <!-- 頂部の祠 -->
    <rect x="-2" y="11" width="4" height="6" fill="#3e2723"/>
    <polygon points="-5,11 5,11 0,5" fill="#ff6f00"/>
  </g>

  <!-- 伊豆美神社の鳥居（朱塗り・市の総鎮守） -->
  <g transform="translate(420,300)">
    <!-- 鳥居 笠木 -->
    <rect x="-30" y="-8" width="60" height="7" rx="2" fill="url(#toriiGrad)"/>
    <rect x="-33" y="-10" width="66" height="4" rx="1.5" fill="url(#toriiGrad)"/>
    <!-- 鳥居 貫 -->
    <rect x="-26" y="6" width="52" height="4" fill="url(#toriiGrad)"/>
    <!-- 鳥居 柱 -->
    <rect x="-22" y="-10" width="6" height="44" fill="url(#toriiGrad)"/>
    <rect x="16" y="-10" width="6" height="44" fill="url(#toriiGrad)"/>
    <!-- 額束 -->
    <rect x="-3" y="-3" width="6" height="9" fill="#bf360c"/>
  </g>

  <!-- 泉龍寺 弁財天池（狛江市名の起源・元和泉） -->
  <g transform="translate(256,310)">
    <ellipse cx="0" cy="0" rx="38" ry="15" fill="url(#pondGrad)"/>
    <ellipse cx="0" cy="-2" rx="32" ry="11" fill="#4fc3f7" opacity="0.6"/>
    <!-- 池の周りの石 -->
    <circle cx="-32" cy="3" r="2.5" fill="#5d4037"/>
    <circle cx="30" cy="2" r="2.8" fill="#5d4037"/>
    <circle cx="-15" cy="11" r="2.3" fill="#6d4c41"/>
    <circle cx="18" cy="10" r="2.5" fill="#5d4037"/>
    <!-- 弁財天の鳥居（池の中央・小型） -->
    <g transform="translate(0,-8)">
      <rect x="-10" y="-12" width="20" height="2" fill="#ff6f00"/>
      <rect x="-8" y="-6" width="16" height="1.5" fill="#ff6f00"/>
      <rect x="-7" y="-12" width="2" height="14" fill="#ff6f00"/>
      <rect x="5" y="-12" width="2" height="14" fill="#ff6f00"/>
    </g>
    <!-- 蓮の葉 -->
    <ellipse cx="-22" cy="-2" rx="5" ry="2" fill="#66bb6a" opacity="0.85"/>
    <ellipse cx="22" cy="0" rx="5" ry="2" fill="#66bb6a" opacity="0.85"/>
  </g>

  <!-- エコルマホール（駅前複合・市民ホール） -->
  <g transform="translate(180,295)">
    <!-- 建物本体 -->
    <rect x="-22" y="-30" width="44" height="38" fill="#eceff1" opacity="0.95"/>
    <rect x="-22" y="-30" width="44" height="6" fill="#0277bd"/>
    <!-- 窓 -->
    <rect x="-17" y="-20" width="6" height="7" fill="#fff176" opacity="0.9"/>
    <rect x="-7" y="-20" width="6" height="7" fill="#fff176" opacity="0.9"/>
    <rect x="3" y="-20" width="6" height="7" fill="#fff176" opacity="0.9"/>
    <rect x="13" y="-20" width="6" height="7" fill="#fff176" opacity="0.9"/>
    <rect x="-17" y="-8" width="6" height="7" fill="#fff176" opacity="0.85"/>
    <rect x="-7" y="-8" width="6" height="7" fill="#fff176" opacity="0.85"/>
    <rect x="3" y="-8" width="6" height="7" fill="#fff176" opacity="0.85"/>
    <rect x="13" y="-8" width="6" height="7" fill="#fff176" opacity="0.85"/>
    <!-- "エコルマ"の旗 -->
    <rect x="0" y="-44" width="1.5" height="14" fill="#37474f"/>
    <rect x="1.5" y="-44" width="10" height="6" fill="#0277bd"/>
  </g>

  <!-- 小田急ロマンスカー（市の唯一の鉄道・南北を貫く） -->
  <g transform="translate(70,225)">
    <!-- 車体 -->
    <rect x="0" y="0" width="60" height="14" rx="3" fill="url(#trainGrad)"/>
    <!-- 先頭の流線形 -->
    <path d="M 0,0 L -8,7 L 0,14 Z" fill="url(#trainGrad)"/>
    <!-- 窓 -->
    <rect x="6" y="3" width="9" height="7" rx="1" fill="#b3e5fc" opacity="0.9"/>
    <rect x="18" y="3" width="9" height="7" rx="1" fill="#b3e5fc" opacity="0.9"/>
    <rect x="30" y="3" width="9" height="7" rx="1" fill="#b3e5fc" opacity="0.9"/>
    <rect x="42" y="3" width="9" height="7" rx="1" fill="#b3e5fc" opacity="0.9"/>
    <!-- ライト -->
    <circle cx="-4" cy="7" r="1.8" fill="#fff176"/>
    <!-- 線路 -->
    <line x1="-12" y1="16" x2="65" y2="16" stroke="#455a64" stroke-width="1.5"/>
  </g>

  <!-- 桜並木（六郷さくら通り） -->
  <g transform="translate(295,250)">
    <circle cx="0" cy="0" r="9" fill="#f8bbd0" opacity="0.95"/>
    <circle cx="3" cy="-2" r="6" fill="#f48fb1" opacity="0.85"/>
    <circle cx="-3" cy="2" r="5" fill="#f06292" opacity="0.75"/>
    <rect x="-1" y="6" width="2" height="10" fill="#5d4037"/>
  </g>
  <g transform="translate(370,255)">
    <circle cx="0" cy="0" r="8" fill="#f8bbd0" opacity="0.95"/>
    <circle cx="2" cy="-1" r="5" fill="#f48fb1" opacity="0.85"/>
    <rect x="-1" y="6" width="2" height="9" fill="#5d4037"/>
  </g>

  <!-- 「狛江」バッジ -->
  <g transform="translate(256,408)">
    <circle cx="0" cy="0" r="38" fill="#ffffff" opacity="0.96"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#0277bd" stroke-width="3"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#e65100" stroke-width="1.5"/>
    <text x="0" y="9" text-anchor="middle" font-family="'M PLUS Rounded 1c', sans-serif" font-size="32" font-weight="700" fill="#0277bd">狛江</text>
  </g>

  <!-- 等高線（多摩川と崖線の繊細な起伏） -->
  <path d="M 0,375 Q 130,372 256,377 Q 380,382 512,377" stroke="#ffffff" stroke-width="0.9" fill="none" opacity="0.35" stroke-dasharray="3,3"/>
  <path d="M 0,355 Q 130,352 256,357 Q 380,362 512,357" stroke="#ffffff" stroke-width="0.9" fill="none" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- 鴨（多摩川の鳥） -->
  <g transform="translate(440,455)">
    <ellipse cx="0" cy="0" rx="8" ry="3.5" fill="#37474f"/>
    <circle cx="-7" cy="-3" r="2.8" fill="#37474f"/>
    <circle cx="-8" cy="-3.5" r="0.7" fill="#fff176"/>
    <path d="M -10,-3 L -12,-2 L -10,-1 Z" fill="#ff6f00"/>
  </g>
  <g transform="translate(105,440)">
    <ellipse cx="0" cy="0" rx="6" ry="2.8" fill="#455a64"/>
    <circle cx="-5" cy="-2" r="2.2" fill="#455a64"/>
    <path d="M -7,-2 L -9,-1.5 L -7,-1 Z" fill="#ff6f00"/>
  </g>

</svg>
