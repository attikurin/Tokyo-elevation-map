<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- ふくろうマゼンタ × 染井桜オレンジ × サンシャイン夜景パープル -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e57c2"/>
      <stop offset="45%" stop-color="#c2185b"/>
      <stop offset="100%" stop-color="#5e35b1"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9575cd"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>
    <linearGradient id="sakura" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcdd2"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#f57c00" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#e1bee7" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- 背景（マゼンタから夕焼けパープル） -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 月（夜景イメージ） -->
  <circle cx="100" cy="95" r="34" fill="url(#moon)" opacity="0.9"/>
  <circle cx="100" cy="95" r="22" fill="#fffde7" opacity="0.95"/>
  <!-- 月のクレーター（控えめ） -->
  <circle cx="95" cy="92" r="3" fill="#e1bee7" opacity="0.5"/>
  <circle cx="106" cy="98" r="2" fill="#e1bee7" opacity="0.5"/>

  <!-- 星々 -->
  <g fill="#fff9c4">
    <circle cx="175" cy="60" r="1.5" opacity="0.9"/>
    <circle cx="230" cy="80" r="1.2" opacity="0.7"/>
    <circle cx="320" cy="55" r="1.8" opacity="0.95"/>
    <circle cx="380" cy="95" r="1.3" opacity="0.8"/>
    <circle cx="440" cy="60" r="1.6" opacity="0.85"/>
  </g>

  <!-- サンシャイン60（豊島区最高所260m・夜景のシンボル） -->
  <g transform="translate(330,140)">
    <!-- 本体 -->
    <rect x="-32" y="0" width="64" height="190" fill="url(#building)"/>
    <!-- 屋根 -->
    <rect x="-36" y="-6" width="72" height="6" fill="#1a0a4a"/>
    <!-- アンテナ -->
    <line x1="0" y1="-6" x2="0" y2="-30" stroke="#1a0a4a" stroke-width="2"/>
    <circle cx="0" cy="-30" r="3" fill="#ff5252"/>
    <!-- 窓（夜景の灯り：1階あたり数行） -->
    <g fill="#fff9c4">
      <rect x="-26" y="12" width="4" height="6"/>
      <rect x="-18" y="12" width="4" height="6"/>
      <rect x="-10" y="12" width="4" height="6" opacity="0.4"/>
      <rect x="-2" y="12" width="4" height="6"/>
      <rect x="6" y="12" width="4" height="6"/>
      <rect x="14" y="12" width="4" height="6" opacity="0.5"/>
      <rect x="22" y="12" width="4" height="6"/>
      <rect x="-26" y="28" width="4" height="6" opacity="0.6"/>
      <rect x="-18" y="28" width="4" height="6"/>
      <rect x="-10" y="28" width="4" height="6"/>
      <rect x="-2" y="28" width="4" height="6" opacity="0.4"/>
      <rect x="6" y="28" width="4" height="6"/>
      <rect x="14" y="28" width="4" height="6"/>
      <rect x="22" y="28" width="4" height="6" opacity="0.5"/>
      <rect x="-26" y="44" width="4" height="6"/>
      <rect x="-18" y="44" width="4" height="6" opacity="0.4"/>
      <rect x="-10" y="44" width="4" height="6"/>
      <rect x="-2" y="44" width="4" height="6"/>
      <rect x="6" y="44" width="4" height="6" opacity="0.6"/>
      <rect x="14" y="44" width="4" height="6"/>
      <rect x="22" y="44" width="4" height="6"/>
      <rect x="-26" y="60" width="4" height="6"/>
      <rect x="-18" y="60" width="4" height="6"/>
      <rect x="-10" y="60" width="4" height="6" opacity="0.5"/>
      <rect x="-2" y="60" width="4" height="6"/>
      <rect x="6" y="60" width="4" height="6"/>
      <rect x="14" y="60" width="4" height="6" opacity="0.4"/>
      <rect x="22" y="60" width="4" height="6"/>
      <rect x="-26" y="76" width="4" height="6" opacity="0.6"/>
      <rect x="-18" y="76" width="4" height="6"/>
      <rect x="-10" y="76" width="4" height="6"/>
      <rect x="-2" y="76" width="4" height="6"/>
      <rect x="6" y="76" width="4" height="6"/>
      <rect x="14" y="76" width="4" height="6" opacity="0.5"/>
      <rect x="22" y="76" width="4" height="6"/>
      <rect x="-26" y="92" width="4" height="6"/>
      <rect x="-18" y="92" width="4" height="6" opacity="0.4"/>
      <rect x="-10" y="92" width="4" height="6"/>
      <rect x="-2" y="92" width="4" height="6"/>
      <rect x="6" y="92" width="4" height="6"/>
      <rect x="14" y="92" width="4" height="6"/>
      <rect x="22" y="92" width="4" height="6" opacity="0.6"/>
      <rect x="-26" y="108" width="4" height="6"/>
      <rect x="-18" y="108" width="4" height="6"/>
      <rect x="-10" y="108" width="4" height="6" opacity="0.5"/>
      <rect x="-2" y="108" width="4" height="6"/>
      <rect x="6" y="108" width="4" height="6"/>
      <rect x="14" y="108" width="4" height="6"/>
      <rect x="22" y="108" width="4" height="6"/>
      <rect x="-26" y="124" width="4" height="6"/>
      <rect x="-18" y="124" width="4" height="6"/>
      <rect x="-10" y="124" width="4" height="6"/>
      <rect x="-2" y="124" width="4" height="6" opacity="0.4"/>
      <rect x="6" y="124" width="4" height="6"/>
      <rect x="14" y="124" width="4" height="6"/>
      <rect x="22" y="124" width="4" height="6"/>
      <rect x="-26" y="140" width="4" height="6" opacity="0.5"/>
      <rect x="-18" y="140" width="4" height="6"/>
      <rect x="-10" y="140" width="4" height="6"/>
      <rect x="-2" y="140" width="4" height="6"/>
      <rect x="6" y="140" width="4" height="6"/>
      <rect x="14" y="140" width="4" height="6" opacity="0.6"/>
      <rect x="22" y="140" width="4" height="6"/>
      <rect x="-26" y="156" width="4" height="6"/>
      <rect x="-18" y="156" width="4" height="6" opacity="0.4"/>
      <rect x="-10" y="156" width="4" height="6"/>
      <rect x="-2" y="156" width="4" height="6"/>
      <rect x="6" y="156" width="4" height="6"/>
      <rect x="14" y="156" width="4" height="6"/>
      <rect x="22" y="156" width="4" height="6"/>
      <rect x="-26" y="172" width="4" height="6"/>
      <rect x="-18" y="172" width="4" height="6"/>
      <rect x="-10" y="172" width="4" height="6" opacity="0.5"/>
      <rect x="-2" y="172" width="4" height="6"/>
      <rect x="6" y="172" width="4" height="6"/>
      <rect x="14" y="172" width="4" height="6"/>
      <rect x="22" y="172" width="4" height="6"/>
    </g>
  </g>

  <!-- 周辺の高層ビル群（池袋スカイライン） -->
  <g fill="url(#building)" opacity="0.85">
    <rect x="225" y="200" width="40" height="130"/>
    <rect x="270" y="220" width="32" height="110"/>
    <rect x="385" y="195" width="35" height="135"/>
    <rect x="430" y="225" width="28" height="105"/>
  </g>
  <!-- 高層ビル群の窓 -->
  <g fill="#fff9c4">
    <rect x="232" y="210" width="3" height="5"/>
    <rect x="240" y="210" width="3" height="5"/>
    <rect x="248" y="210" width="3" height="5" opacity="0.5"/>
    <rect x="256" y="210" width="3" height="5"/>
    <rect x="232" y="225" width="3" height="5"/>
    <rect x="240" y="225" width="3" height="5" opacity="0.4"/>
    <rect x="248" y="225" width="3" height="5"/>
    <rect x="256" y="225" width="3" height="5"/>
    <rect x="232" y="240" width="3" height="5"/>
    <rect x="240" y="240" width="3" height="5"/>
    <rect x="248" y="240" width="3" height="5"/>
    <rect x="256" y="240" width="3" height="5" opacity="0.5"/>
    <rect x="395" y="210" width="3" height="5"/>
    <rect x="403" y="210" width="3" height="5" opacity="0.4"/>
    <rect x="411" y="210" width="3" height="5"/>
    <rect x="395" y="225" width="3" height="5"/>
    <rect x="403" y="225" width="3" height="5"/>
    <rect x="411" y="225" width="3" height="5"/>
    <rect x="395" y="240" width="3" height="5" opacity="0.5"/>
    <rect x="403" y="240" width="3" height="5"/>
    <rect x="411" y="240" width="3" height="5"/>
  </g>

  <!-- 豊島台地（地形の起伏：手前のなだらかな丘） -->
  <path d="M0,335 Q90,320 180,330 Q260,310 340,325 Q420,315 512,330 L512,395 L0,395 Z"
        fill="#4a148c" opacity="0.6"/>
  <!-- 神田川の谷（左下） -->
  <path d="M0,395 Q120,388 200,395 Q280,402 360,395 Q430,390 512,395 L512,420 Q430,420 360,425 Q280,432 200,425 Q120,420 0,420 Z"
        fill="#5e35b1" opacity="0.85"/>
  <path d="M40,408 Q140,402 256,408 T500,402" stroke="#fff" stroke-width="1" fill="none" opacity="0.35"/>

  <!-- ふくろう（池袋シンボル・西口のいけふくろう像） -->
  <g transform="translate(130,280)">
    <!-- 体 -->
    <ellipse cx="0" cy="8" rx="36" ry="40" fill="#5d4037"/>
    <!-- お腹（明るめ） -->
    <ellipse cx="0" cy="12" rx="22" ry="26" fill="#a1887f"/>
    <!-- お腹の縞模様 -->
    <path d="M-14,2 Q0,6 14,2" stroke="#5d4037" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M-12,14 Q0,18 12,14" stroke="#5d4037" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M-10,26 Q0,30 10,26" stroke="#5d4037" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- 頭 -->
    <ellipse cx="0" cy="-20" rx="30" ry="26" fill="#5d4037"/>
    <!-- 耳（角） -->
    <path d="M-22,-36 L-18,-22 L-26,-26 Z" fill="#5d4037"/>
    <path d="M22,-36 L18,-22 L26,-26 Z" fill="#5d4037"/>
    <!-- 顔（白いハート型） -->
    <path d="M-16,-22 Q-22,-14 -14,-6 Q-8,0 0,-4 Q8,0 14,-6 Q22,-14 16,-22 Q8,-26 0,-22 Q-8,-26 -16,-22 Z"
          fill="#f5f5dc" opacity="0.95"/>
    <!-- 目（金色の大きな目） -->
    <circle cx="-7" cy="-16" r="6" fill="#fff9c4"/>
    <circle cx="7" cy="-16" r="6" fill="#fff9c4"/>
    <circle cx="-7" cy="-16" r="4.5" fill="#f57c00"/>
    <circle cx="7" cy="-16" r="4.5" fill="#f57c00"/>
    <circle cx="-7" cy="-15" r="2" fill="#1a0a4a"/>
    <circle cx="7" cy="-15" r="2" fill="#1a0a4a"/>
    <!-- 目のハイライト -->
    <circle cx="-6" cy="-16" r="0.8" fill="#fff"/>
    <circle cx="8" cy="-16" r="0.8" fill="#fff"/>
    <!-- くちばし -->
    <path d="M0,-8 L-3,-2 L3,-2 Z" fill="#e8b04b"/>
    <!-- 翼の輪郭 -->
    <path d="M-30,8 Q-38,20 -28,40" stroke="#3e2723" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M30,8 Q38,20 28,40" stroke="#3e2723" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>

  <!-- ソメイヨシノ（駒込発祥の桜：右下） -->
  <g transform="translate(430,340)">
    <!-- 幹 -->
    <path d="M0,0 L-2,-30 L-5,-50" stroke="#5d4037" stroke-width="3" fill="none"/>
    <!-- 花のクラスター -->
    <circle cx="-5" cy="-55" r="22" fill="url(#sakura)"/>
    <circle cx="-18" cy="-48" r="14" fill="url(#sakura)"/>
    <circle cx="8" cy="-50" r="16" fill="url(#sakura)"/>
    <circle cx="-3" cy="-70" r="13" fill="url(#sakura)"/>
    <!-- 花びら（個々のソメイヨシノ） -->
    <g fill="#fff" opacity="0.8">
      <circle cx="-5" cy="-55" r="2"/>
      <circle cx="2" cy="-60" r="1.5"/>
      <circle cx="-12" cy="-50" r="1.8"/>
      <circle cx="-3" cy="-72" r="1.5"/>
    </g>
    <!-- 散る花びら -->
    <g fill="#f8bbd0" opacity="0.8">
      <ellipse cx="-30" cy="-30" rx="3" ry="2" transform="rotate(30 -30 -30)"/>
      <ellipse cx="-25" cy="-10" rx="2.5" ry="1.5" transform="rotate(45 -25 -10)"/>
      <ellipse cx="-35" cy="-55" rx="2" ry="1.2" transform="rotate(60 -35 -55)"/>
    </g>
  </g>

  <!-- 巣鴨地蔵風の鳥居（シルエット） -->
  <g transform="translate(70,355)" opacity="0.9">
    <!-- 鳥居 -->
    <rect x="-14" y="-20" width="28" height="3" fill="#c62828"/>
    <rect x="-16" y="-24" width="32" height="3" fill="#c62828"/>
    <rect x="-12" y="-20" width="3" height="20" fill="#c62828"/>
    <rect x="9" y="-20" width="3" height="20" fill="#c62828"/>
  </g>

  <!-- タイトル風サイン -->
  <rect x="80" y="455" width="80" height="22" rx="11" fill="#4a148c" opacity="0.9"/>
  <text x="120" y="471" font-family="sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#ffcdd2">豊島</text>
</svg>
