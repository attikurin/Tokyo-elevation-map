<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 夜の渋谷グラデ（ピンク〜パープル） -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="50%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <!-- ネオンの窓 -->
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff59d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff6f00" stop-opacity="0.85"/>
    </linearGradient>
    <!-- ビル -->
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>
    <!-- 渋谷の谷（断面） -->
    <linearGradient id="valley" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a1b9a"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>
  </defs>

  <!-- 背景（夜空グラデ） -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 月（左上） -->
  <circle cx="105" cy="100" r="28" fill="#fff59d" opacity="0.95"/>
  <circle cx="115" cy="96" r="24" fill="#e91e63" opacity="0.9"/>

  <!-- 星 -->
  <circle cx="380" cy="80" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="420" cy="120" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="350" cy="140" r="2" fill="#fff" opacity="0.8"/>

  <!-- 渋谷の谷（地形断面 - 中央が低い谷形） -->
  <path d="M0,400 L80,360 L150,330 L200,360 L256,420 L312,360 L362,330 L432,360 L512,400 L512,512 L0,512 Z"
        fill="url(#valley)" opacity="0.55"/>
  <!-- 渋谷川（谷底のライン） -->
  <path d="M0,440 Q120,425 256,442 T512,438 L512,455 Q256,470 0,452 Z"
        fill="#4fc3f7" opacity="0.55"/>

  <!-- 左の高台（淀橋台側）の高層ビル -->
  <rect x="55" y="220" width="36" height="200" fill="url(#bldg)"/>
  <rect x="100" y="200" width="32" height="220" fill="url(#bldg)"/>
  <rect x="140" y="240" width="30" height="180" fill="url(#bldg)"/>

  <!-- 渋谷の谷の中心ビル群（スクランブル一帯） -->
  <rect x="200" y="260" width="36" height="160" fill="url(#bldg)"/>
  <rect x="244" y="240" width="40" height="180" fill="url(#bldg)"/>
  <rect x="292" y="220" width="32" height="200" fill="url(#bldg)"/>

  <!-- 右の高台（豊島台／青山）の高層ビル -->
  <rect x="340" y="200" width="34" height="220" fill="url(#bldg)"/>
  <rect x="382" y="220" width="36" height="200" fill="url(#bldg)"/>
  <rect x="428" y="240" width="32" height="180" fill="url(#bldg)"/>

  <!-- ネオン看板（中央のピンクサイン） -->
  <rect x="244" y="210" width="40" height="22" rx="4" fill="#ff4081"/>
  <rect x="248" y="216" width="32" height="3" fill="#fff" opacity="0.9"/>
  <rect x="248" y="222" width="22" height="3" fill="#fff" opacity="0.9"/>

  <!-- ビルの窓（ネオン点灯） -->
  <g fill="url(#window)" opacity="0.92">
    <!-- 左ビル群 -->
    <rect x="62" y="240" width="5" height="5"/>
    <rect x="74" y="240" width="5" height="5"/>
    <rect x="62" y="260" width="5" height="5"/>
    <rect x="74" y="260" width="5" height="5"/>
    <rect x="62" y="290" width="5" height="5"/>
    <rect x="74" y="290" width="5" height="5"/>
    <rect x="62" y="320" width="5" height="5"/>
    <rect x="74" y="320" width="5" height="5"/>

    <rect x="106" y="220" width="5" height="5"/>
    <rect x="118" y="220" width="5" height="5"/>
    <rect x="106" y="250" width="5" height="5"/>
    <rect x="118" y="250" width="5" height="5"/>
    <rect x="106" y="280" width="5" height="5"/>
    <rect x="118" y="280" width="5" height="5"/>
    <rect x="106" y="310" width="5" height="5"/>
    <rect x="118" y="310" width="5" height="5"/>

    <rect x="146" y="260" width="5" height="5"/>
    <rect x="158" y="260" width="5" height="5"/>
    <rect x="146" y="290" width="5" height="5"/>
    <rect x="158" y="290" width="5" height="5"/>
    <rect x="146" y="320" width="5" height="5"/>
    <rect x="158" y="320" width="5" height="5"/>

    <!-- 中央ビル群 -->
    <rect x="206" y="280" width="5" height="5"/>
    <rect x="220" y="280" width="5" height="5"/>
    <rect x="206" y="310" width="5" height="5"/>
    <rect x="220" y="310" width="5" height="5"/>
    <rect x="206" y="340" width="5" height="5"/>
    <rect x="220" y="340" width="5" height="5"/>

    <rect x="250" y="260" width="5" height="5"/>
    <rect x="264" y="260" width="5" height="5"/>
    <rect x="276" y="260" width="5" height="5"/>
    <rect x="250" y="290" width="5" height="5"/>
    <rect x="276" y="290" width="5" height="5"/>
    <rect x="250" y="320" width="5" height="5"/>
    <rect x="264" y="320" width="5" height="5"/>
    <rect x="276" y="320" width="5" height="5"/>

    <rect x="298" y="240" width="5" height="5"/>
    <rect x="310" y="240" width="5" height="5"/>
    <rect x="298" y="270" width="5" height="5"/>
    <rect x="310" y="270" width="5" height="5"/>
    <rect x="298" y="300" width="5" height="5"/>
    <rect x="310" y="300" width="5" height="5"/>

    <!-- 右ビル群 -->
    <rect x="346" y="220" width="5" height="5"/>
    <rect x="358" y="220" width="5" height="5"/>
    <rect x="346" y="250" width="5" height="5"/>
    <rect x="358" y="250" width="5" height="5"/>
    <rect x="346" y="280" width="5" height="5"/>
    <rect x="358" y="280" width="5" height="5"/>
    <rect x="346" y="310" width="5" height="5"/>
    <rect x="358" y="310" width="5" height="5"/>

    <rect x="388" y="240" width="5" height="5"/>
    <rect x="402" y="240" width="5" height="5"/>
    <rect x="388" y="270" width="5" height="5"/>
    <rect x="402" y="270" width="5" height="5"/>
    <rect x="388" y="300" width="5" height="5"/>
    <rect x="402" y="300" width="5" height="5"/>

    <rect x="434" y="260" width="5" height="5"/>
    <rect x="448" y="260" width="5" height="5"/>
    <rect x="434" y="290" width="5" height="5"/>
    <rect x="448" y="290" width="5" height="5"/>
    <rect x="434" y="320" width="5" height="5"/>
    <rect x="448" y="320" width="5" height="5"/>
  </g>

  <!-- 街灯／ネオンの輝き（点） -->
  <circle cx="180" cy="380" r="3" fill="#ff6f00"/>
  <circle cx="320" cy="380" r="3" fill="#ffd54f"/>
  <circle cx="256" cy="430" r="2.5" fill="#fff"/>
</svg>
