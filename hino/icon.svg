<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 新選組の浅葱色（あさぎいろ）× 多摩川ブルー -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ba3c7"/>
      <stop offset="55%" stop-color="#1e6091"/>
      <stop offset="100%" stop-color="#0d3b5c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d588"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#e8b04b"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#e8b04b" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- 背景（浅葱色の空） -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 太陽 -->
  <circle cx="406" cy="100" r="42" fill="url(#sun)" opacity="0.9"/>
  <circle cx="406" cy="100" r="26" fill="#fffde7" opacity="0.9"/>

  <!-- 雲 -->
  <ellipse cx="120" cy="80" rx="34" ry="9" fill="#fff" opacity="0.75"/>
  <ellipse cx="155" cy="78" rx="26" ry="7" fill="#fff" opacity="0.55"/>

  <!-- 新選組の「だんだら模様」装飾（左上の旗） -->
  <g transform="translate(38, 60)">
    <!-- 旗の地（浅葱） -->
    <rect x="0" y="0" width="58" height="60" rx="4" fill="#1e6091" stroke="#fff" stroke-width="1.5"/>
    <!-- だんだら模様（ホワイトのギザギザ：山形が新選組羽織の裾の意匠） -->
    <g fill="#fff">
      <path d="M0,46 L10,30 L20,46 L30,30 L40,46 L50,30 L58,46 L58,60 L0,60 Z"/>
    </g>
    <!-- 「誠」の文字（新選組旗印） -->
    <text x="29" y="22" font-family="serif" font-size="18" font-weight="bold"
          text-anchor="middle" fill="#fff">誠</text>
  </g>

  <!-- 多摩丘陵（背景の山並み：日野市南部） -->
  <path d="M0,260 Q90,225 180,250 Q260,210 340,245 Q420,215 512,250 L512,330 L0,330 Z"
        fill="url(#hill)" opacity="0.92"/>

  <!-- 日野台地（中段の台地） -->
  <path d="M0,330 L80,325 L160,335 L230,330 L300,338 L370,332 L440,338 L512,335 L512,395 L0,395 Z"
        fill="#558b2f" opacity="0.85"/>

  <!-- 田んぼ（稲穂の金色：日野は稲作地帯） -->
  <g opacity="0.95">
    <!-- 田んぼ1（左） -->
    <rect x="30" y="370" width="120" height="18" fill="url(#rice)" rx="2"/>
    <!-- 稲のテクスチャ -->
    <g stroke="#7a5a1e" stroke-width="0.8" opacity="0.7">
      <line x1="45" y1="372" x2="45" y2="385"/>
      <line x1="60" y1="372" x2="60" y2="385"/>
      <line x1="75" y1="372" x2="75" y2="385"/>
      <line x1="90" y1="372" x2="90" y2="385"/>
      <line x1="105" y1="372" x2="105" y2="385"/>
      <line x1="120" y1="372" x2="120" y2="385"/>
      <line x1="135" y1="372" x2="135" y2="385"/>
    </g>
    <!-- 田んぼ2（右） -->
    <rect x="360" y="370" width="120" height="18" fill="url(#rice)" rx="2"/>
    <g stroke="#7a5a1e" stroke-width="0.8" opacity="0.7">
      <line x1="375" y1="372" x2="375" y2="385"/>
      <line x1="390" y1="372" x2="390" y2="385"/>
      <line x1="405" y1="372" x2="405" y2="385"/>
      <line x1="420" y1="372" x2="420" y2="385"/>
      <line x1="435" y1="372" x2="435" y2="385"/>
      <line x1="450" y1="372" x2="450" y2="385"/>
      <line x1="465" y1="372" x2="465" y2="385"/>
    </g>
  </g>

  <!-- 多摩川 + 浅川の合流（日野市最大の地形特徴） -->
  <!-- 多摩川（上から流れる、太め） -->
  <path d="M0,395 Q120,395 240,405 Q280,408 320,400 Q400,395 512,395 L512,440 Q400,440 320,448 Q280,450 240,450 Q120,442 0,440 Z"
        fill="url(#river)" opacity="0.9"/>
  <!-- 浅川（下から合流、細め） -->
  <path d="M180,512 Q200,475 240,455 Q280,452 320,448 Q360,448 380,460 Q400,485 410,512 Z"
        fill="url(#river)" opacity="0.85"/>
  <!-- 合流点の渦の表現 -->
  <circle cx="290" cy="450" r="14" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <circle cx="290" cy="450" r="7" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <!-- 川面の光 -->
  <path d="M0,415 Q120,410 256,420 T512,412" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M40,432 Q180,425 320,433 T500,427" stroke="#fff" stroke-width="1" fill="none" opacity="0.35"/>

  <!-- 高幡不動の五重塔（中央の高台に立つ象徴） -->
  <g transform="translate(256,200)">
    <!-- 塔の本体（5層、上にいくほど小さく） -->
    <rect x="-30" y="50" width="60" height="14" fill="#c62828"/>
    <rect x="-32" y="48" width="64" height="4" fill="#5d2e2e"/>
    <rect x="-26" y="32" width="52" height="14" fill="#c62828"/>
    <rect x="-28" y="30" width="56" height="4" fill="#5d2e2e"/>
    <rect x="-22" y="14" width="44" height="14" fill="#c62828"/>
    <rect x="-24" y="12" width="48" height="4" fill="#5d2e2e"/>
    <rect x="-18" y="-4" width="36" height="14" fill="#c62828"/>
    <rect x="-20" y="-6" width="40" height="4" fill="#5d2e2e"/>
    <rect x="-14" y="-20" width="28" height="14" fill="#c62828"/>
    <rect x="-16" y="-22" width="32" height="4" fill="#5d2e2e"/>
    <!-- 屋根の上の相輪 -->
    <line x1="0" y1="-22" x2="0" y2="-44" stroke="#fbc02d" stroke-width="2"/>
    <circle cx="0" cy="-44" r="3" fill="#fbc02d"/>
    <circle cx="0" cy="-36" r="2" fill="#fbc02d"/>
    <circle cx="0" cy="-30" r="2" fill="#fbc02d"/>
  </g>

  <!-- 樹々（多摩丘陵の森） -->
  <g transform="translate(80,250)">
    <ellipse cx="0" cy="0" rx="22" ry="20" fill="url(#hill)"/>
    <ellipse cx="-12" cy="-6" rx="14" ry="13" fill="url(#hill)"/>
    <ellipse cx="14" cy="-4" rx="12" ry="11" fill="url(#hill)"/>
    <rect x="-3" y="16" width="6" height="14" fill="#6d4c2b"/>
  </g>
  <g transform="translate(430,255)">
    <ellipse cx="0" cy="0" rx="22" ry="20" fill="url(#hill)"/>
    <ellipse cx="-12" cy="-6" rx="14" ry="13" fill="url(#hill)"/>
    <ellipse cx="14" cy="-4" rx="12" ry="11" fill="url(#hill)"/>
    <rect x="-3" y="16" width="6" height="14" fill="#6d4c2b"/>
  </g>
  <!-- 中サイズの樹 -->
  <g transform="translate(170,310)">
    <ellipse cx="0" cy="0" rx="14" ry="12" fill="url(#hill)"/>
    <rect x="-2" y="10" width="4" height="10" fill="#6d4c2b"/>
  </g>
  <g transform="translate(340,315)">
    <ellipse cx="0" cy="0" rx="14" ry="12" fill="url(#hill)"/>
    <rect x="-2" y="10" width="4" height="10" fill="#6d4c2b"/>
  </g>

  <!-- 用水路の小さな十字（水と緑のふるさと象徴） -->
  <g stroke="#4fc3f7" stroke-width="2" opacity="0.7" fill="none">
    <path d="M210,400 L210,412"/>
    <path d="M204,406 L216,406"/>
    <path d="M340,402 L340,414"/>
    <path d="M334,408 L346,408"/>
  </g>

  <!-- タイトル風サイン -->
  <rect x="80" y="455" width="80" height="22" rx="11" fill="#0d3b5c" opacity="0.9"/>
  <text x="120" y="471" font-family="sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#fff59d">日野</text>
</svg>
