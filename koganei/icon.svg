<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>小金井市 高低マップ アイコン</title>
  <defs>
    <!-- 桜色の空（小金井桜・春の朝） -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="55%" stop-color="#f8bbd0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <!-- 武蔵野台地（武蔵野段丘の上面・はけの上） -->
    <linearGradient id="dandanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed581"/>
      <stop offset="100%" stop-color="#7cb342"/>
    </linearGradient>
    <!-- はけ・国分寺崖線（湧水の崖） -->
    <linearGradient id="hakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ccc65"/>
      <stop offset="60%" stop-color="#558b2f"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <!-- 野川（はけの下・崖下の小川） -->
    <linearGradient id="nogawaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="50%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#1976d2"/>
    </linearGradient>
    <!-- 玉川上水（小金井桜の用水路） -->
    <linearGradient id="tamaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <!-- 小金井桜の花びら -->
    <radialGradient id="sakuraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="40%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#ec407a"/>
    </radialGradient>
    <!-- 江戸東京たてもの園・茅葺き屋根 -->
    <linearGradient id="kayaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
    <!-- 中央線（オレンジバーミリオン） -->
    <linearGradient id="trainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef6c00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>
    <!-- 太陽 -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </radialGradient>
    <!-- 湧水の波紋 -->
    <radialGradient id="springGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e1f5fe"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </radialGradient>
    <!-- 鳥居（小金井神社） -->
    <linearGradient id="toriiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <!-- 楓・武蔵野の紅葉 -->
    <radialGradient id="momijiGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffab40"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </radialGradient>
  </defs>

  <!-- 背景：桜色の空 -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#skyGrad)"/>

  <!-- 太陽 -->
  <circle cx="400" cy="115" r="42" fill="url(#sunGrad)" opacity="0.92"/>
  <circle cx="400" cy="115" r="56" fill="none" stroke="#fbc02d" stroke-width="2" opacity="0.35"/>

  <!-- 遠景の武蔵野段丘ライン（武蔵野台地の上面） -->
  <path d="M 0 230 Q 80 215 160 222 T 320 218 T 512 225 L 512 280 L 0 280 Z" fill="url(#dandanGrad)" opacity="0.7"/>

  <!-- 中段：はけの上（武蔵野台地上面・住宅地のレベル） -->
  <path d="M 0 245 Q 100 235 200 240 T 400 238 T 512 245 L 512 320 L 0 320 Z" fill="url(#dandanGrad)"/>

  <!-- 玉川上水（市中央部を東西に貫く・水色の細い帯） -->
  <path d="M 0 300 Q 128 295 256 298 T 512 300" fill="none" stroke="url(#tamaGrad)" stroke-width="9" stroke-linecap="round" opacity="0.95"/>
  <!-- 玉川上水のさざ波 -->
  <path d="M 60 304 q 20 -4 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>

  <!-- 小金井桜（玉川上水沿いの桜・国指定名勝） -->
  <!-- 桜の幹 -->
  <path d="M 100 295 Q 102 280 105 268" fill="none" stroke="#6d4c41" stroke-width="3"/>
  <path d="M 180 295 Q 182 278 185 265" fill="none" stroke="#6d4c41" stroke-width="3"/>
  <path d="M 340 295 Q 342 278 345 265" fill="none" stroke="#6d4c41" stroke-width="3"/>
  <path d="M 420 295 Q 422 280 425 268" fill="none" stroke="#6d4c41" stroke-width="3"/>
  <!-- 桜の樹冠（クラスター） -->
  <g opacity="0.95">
    <circle cx="105" cy="255" r="22" fill="url(#sakuraGrad)"/>
    <circle cx="92" cy="248" r="14" fill="url(#sakuraGrad)"/>
    <circle cx="118" cy="250" r="14" fill="url(#sakuraGrad)"/>
    <circle cx="185" cy="252" r="24" fill="url(#sakuraGrad)"/>
    <circle cx="170" cy="246" r="15" fill="url(#sakuraGrad)"/>
    <circle cx="200" cy="248" r="15" fill="url(#sakuraGrad)"/>
    <circle cx="345" cy="252" r="24" fill="url(#sakuraGrad)"/>
    <circle cx="330" cy="246" r="15" fill="url(#sakuraGrad)"/>
    <circle cx="360" cy="248" r="15" fill="url(#sakuraGrad)"/>
    <circle cx="425" cy="255" r="22" fill="url(#sakuraGrad)"/>
    <circle cx="412" cy="248" r="14" fill="url(#sakuraGrad)"/>
    <circle cx="438" cy="250" r="14" fill="url(#sakuraGrad)"/>
  </g>

  <!-- 散る桜の花びら -->
  <g opacity="0.85">
    <circle cx="230" cy="170" r="3.5" fill="#ec407a"/>
    <circle cx="265" cy="200" r="2.5" fill="#f06292"/>
    <circle cx="290" cy="180" r="3" fill="#ec407a"/>
    <circle cx="155" cy="180" r="2.5" fill="#f06292"/>
    <circle cx="305" cy="210" r="2" fill="#ec407a"/>
    <circle cx="250" cy="155" r="2.5" fill="#f8bbd0"/>
    <circle cx="380" cy="190" r="3" fill="#ec407a"/>
    <circle cx="220" cy="225" r="2" fill="#f06292"/>
  </g>

  <!-- 江戸東京たてもの園・茅葺き屋根の家（小金井公園内） -->
  <g transform="translate(220, 285)">
    <!-- 茅葺き屋根 -->
    <path d="M -32 -2 L 0 -28 L 32 -2 L 28 -2 L 28 18 L -28 18 L -28 -2 Z" fill="url(#kayaGrad)"/>
    <!-- 屋根の棟 -->
    <path d="M -32 -2 L 32 -2" stroke="#3e2723" stroke-width="1.5"/>
    <!-- 壁（白漆喰） -->
    <rect x="-26" y="-2" width="52" height="20" fill="#f5f5f5"/>
    <!-- 障子の格子 -->
    <rect x="-20" y="2" width="14" height="14" fill="#fff8e1" stroke="#8d6e63" stroke-width="0.8"/>
    <rect x="6" y="2" width="14" height="14" fill="#fff8e1" stroke="#8d6e63" stroke-width="0.8"/>
    <line x1="-13" y1="2" x2="-13" y2="16" stroke="#8d6e63" stroke-width="0.5"/>
    <line x1="13" y1="2" x2="13" y2="16" stroke="#8d6e63" stroke-width="0.5"/>
    <line x1="-20" y1="9" x2="-6" y2="9" stroke="#8d6e63" stroke-width="0.5"/>
    <line x1="6" y1="9" x2="20" y2="9" stroke="#8d6e63" stroke-width="0.5"/>
  </g>

  <!-- 小金井神社の鳥居（中央） -->
  <g transform="translate(256, 290)">
    <!-- 笠木 -->
    <path d="M -22 -12 L 22 -12 L 18 -8 L -18 -8 Z" fill="url(#toriiGrad)"/>
    <!-- 島木 -->
    <rect x="-19" y="-8" width="38" height="3" fill="url(#toriiGrad)"/>
    <!-- 貫 -->
    <rect x="-18" y="-1" width="36" height="2" fill="url(#toriiGrad)"/>
    <!-- 柱 -->
    <rect x="-15" y="-5" width="3.5" height="15" fill="url(#toriiGrad)"/>
    <rect x="11.5" y="-5" width="3.5" height="15" fill="url(#toriiGrad)"/>
  </g>

  <!-- はけ（国分寺崖線）の崖の段差表現 -->
  <path d="M 0 320 Q 80 322 160 325 T 320 322 T 512 320 L 512 360 L 0 360 Z" fill="url(#hakeGrad)" opacity="0.95"/>
  <!-- 崖線のテクスチャ：等高線風 -->
  <path d="M 0 335 Q 100 332 200 336 T 400 333 T 512 336" fill="none" stroke="#33691e" stroke-width="1.2" opacity="0.5"/>
  <path d="M 0 350 Q 100 347 200 351 T 400 348 T 512 351" fill="none" stroke="#1b5e20" stroke-width="1.2" opacity="0.4"/>

  <!-- 湧水（はけの湧水・滄浪泉園・貫井神社） -->
  <g transform="translate(380, 345)">
    <circle r="10" fill="url(#springGrad)" opacity="0.7"/>
    <circle r="16" fill="none" stroke="#0288d1" stroke-width="1.2" opacity="0.45"/>
    <circle r="22" fill="none" stroke="#0288d1" stroke-width="0.9" opacity="0.3"/>
  </g>
  <g transform="translate(135, 348)">
    <circle r="8" fill="url(#springGrad)" opacity="0.7"/>
    <circle r="13" fill="none" stroke="#0288d1" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- 武蔵野公園の紅葉（はけの下） -->
  <g opacity="0.92">
    <circle cx="60" cy="372" r="14" fill="url(#momijiGrad)"/>
    <circle cx="52" cy="365" r="9" fill="url(#momijiGrad)"/>
    <circle cx="70" cy="365" r="9" fill="url(#momijiGrad)"/>
    <line x1="60" y1="385" x2="60" y2="398" stroke="#5d4037" stroke-width="2.5"/>

    <circle cx="450" cy="378" r="12" fill="url(#momijiGrad)"/>
    <circle cx="443" cy="372" r="8" fill="url(#momijiGrad)"/>
    <circle cx="458" cy="372" r="8" fill="url(#momijiGrad)"/>
    <line x1="450" y1="390" x2="450" y2="402" stroke="#5d4037" stroke-width="2.5"/>
  </g>

  <!-- 野川（はけの下を流れる小川） -->
  <path d="M 0 405 Q 100 400 180 408 Q 256 415 332 408 Q 412 400 512 408" fill="none" stroke="url(#nogawaGrad)" stroke-width="11" stroke-linecap="round"/>
  <!-- 野川のさざ波 -->
  <path d="M 50 410 q 18 -3 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.55"/>

  <!-- カワセミ（はけ・野川のシンボル） -->
  <g transform="translate(290, 395)">
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="#0288d1"/>
    <ellipse cx="-5" cy="-2" rx="4" ry="3.5" fill="#01579b"/>
    <circle cx="-7" cy="-3" r="0.9" fill="#fff"/>
    <path d="M -10 -3 L -13 -2.5 L -10 -1.5 Z" fill="#212121"/>
    <ellipse cx="3" cy="-1" rx="5" ry="2.5" fill="#0277bd"/>
    <ellipse cx="0" cy="1.5" rx="6" ry="2" fill="#ff7043"/>
  </g>

  <!-- 中央線の電車（市中央を東西に貫く） -->
  <g transform="translate(256, 440)">
    <!-- 線路 -->
    <rect x="-220" y="14" width="440" height="2" fill="#5d4037" opacity="0.6"/>
    <rect x="-220" y="20" width="440" height="2" fill="#5d4037" opacity="0.6"/>
    <!-- 枕木 -->
    <g fill="#6d4c41" opacity="0.5">
      <rect x="-200" y="13" width="2" height="10"/>
      <rect x="-160" y="13" width="2" height="10"/>
      <rect x="-120" y="13" width="2" height="10"/>
      <rect x="-80" y="13" width="2" height="10"/>
      <rect x="-40" y="13" width="2" height="10"/>
      <rect x="0" y="13" width="2" height="10"/>
      <rect x="40" y="13" width="2" height="10"/>
      <rect x="80" y="13" width="2" height="10"/>
      <rect x="120" y="13" width="2" height="10"/>
      <rect x="160" y="13" width="2" height="10"/>
      <rect x="198" y="13" width="2" height="10"/>
    </g>
    <!-- 電車本体（オレンジ・中央線特快） -->
    <rect x="-60" y="-10" width="120" height="22" rx="4" ry="4" fill="url(#trainGrad)"/>
    <rect x="-60" y="-10" width="120" height="3" fill="#bf360c"/>
    <!-- 窓 -->
    <rect x="-52" y="-5" width="14" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <rect x="-32" y="-5" width="14" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <rect x="-12" y="-5" width="14" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <rect x="8" y="-5" width="14" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <rect x="28" y="-5" width="14" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <rect x="48" y="-5" width="10" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <!-- 車輪 -->
    <circle cx="-40" cy="13" r="4" fill="#212121"/>
    <circle cx="40" cy="13" r="4" fill="#212121"/>
    <!-- 中央線オレンジライン -->
    <rect x="-60" y="6" width="120" height="2" fill="#fff8e1" opacity="0.85"/>
  </g>

  <!-- 「小金井」テキスト（最下段に小さく） -->
  <text x="256" y="488" font-family="M PLUS Rounded 1c, Hiragino Sans, sans-serif" font-size="22" font-weight="700" fill="#4a0d2e" text-anchor="middle" opacity="0.92">小金井市</text>
</svg>
