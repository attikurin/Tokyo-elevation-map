<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>国立市 高低マップ アイコン</title>
  <defs>
    <!-- 桜色の空（大学通り桜並木の春） -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="55%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <!-- 武蔵野台地（市北部の段丘上面） -->
    <linearGradient id="dandanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5e1a5"/>
      <stop offset="100%" stop-color="#7cb342"/>
    </linearGradient>
    <!-- 立川崖線（ハケ・青柳段丘との段差） -->
    <linearGradient id="hakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="60%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <!-- 多摩川（市南端） -->
    <linearGradient id="tamaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="50%" stop-color="#29b6f6"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
    <!-- 矢川・ママ下湧水（清流） -->
    <linearGradient id="yagawaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b3e5fc"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <!-- 国立駅旧駅舎（赤い三角屋根） -->
    <linearGradient id="yaneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c62828"/>
      <stop offset="100%" stop-color="#8e0000"/>
    </linearGradient>
    <!-- 兼松講堂（一橋大学・ロマネスク様式） -->
    <linearGradient id="kanematsuGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#8d6e63"/>
    </linearGradient>
    <!-- 兼松講堂屋根（青銅色） -->
    <linearGradient id="kanematsuYaneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
    <!-- 大学通りの桜（花群） -->
    <radialGradient id="sakuraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="50%" stop-color="#f8bbd0"/>
      <stop offset="100%" stop-color="#ec407a"/>
    </radialGradient>
    <!-- 谷保天満宮 鳥居（朱塗り） -->
    <linearGradient id="toriiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <!-- 駅舎の壁（白） -->
    <linearGradient id="ekishaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <!-- 中央線（オレンジバーミリオン） -->
    <linearGradient id="trainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef6c00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>
    <!-- 太陽 -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </radialGradient>
    <!-- ママ下湧水（名水百選） -->
    <radialGradient id="springGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e1f5fe"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </radialGradient>
  </defs>

  <!-- 背景：桜色の空 -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#skyGrad)"/>

  <!-- 太陽 -->
  <circle cx="410" cy="115" r="40" fill="url(#sunGrad)" opacity="0.92"/>
  <circle cx="410" cy="115" r="54" fill="none" stroke="#fbc02d" stroke-width="2" opacity="0.35"/>

  <!-- 遠景の武蔵野段丘ライン（市北部・国立駅周辺の上面） -->
  <path d="M 0 230 Q 80 215 160 222 T 320 218 T 512 225 L 512 280 L 0 280 Z" fill="url(#dandanGrad)" opacity="0.7"/>

  <!-- 中段：武蔵野台地上面（住宅地のレベル） -->
  <path d="M 0 245 Q 100 235 200 240 T 400 238 T 512 245 L 512 320 L 0 320 Z" fill="url(#dandanGrad)"/>

  <!-- 国立駅 旧駅舎（市の象徴・三角屋根・1926年築・国登録有形文化財） -->
  <g transform="translate(256, 285)">
    <!-- 塔屋（中央の三角屋根が街のシンボル） -->
    <path d="M -50 0 L 0 -55 L 50 0 Z" fill="url(#yaneGrad)"/>
    <!-- 屋根の縁 -->
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#5d0000" stroke-width="1.5"/>
    <!-- 駅舎本体（白壁・木骨） -->
    <rect x="-70" y="0" width="140" height="35" fill="url(#ekishaGrad)"/>
    <!-- 入口（中央アーチ） -->
    <path d="M -12 35 L -12 18 Q -12 10 0 10 Q 12 10 12 18 L 12 35 Z" fill="#5d4037"/>
    <!-- 駅舎の窓（左右対称） -->
    <rect x="-58" y="10" width="14" height="14" fill="#b3e5fc" stroke="#0277bd" stroke-width="0.8"/>
    <rect x="-38" y="10" width="14" height="14" fill="#b3e5fc" stroke="#0277bd" stroke-width="0.8"/>
    <rect x="24" y="10" width="14" height="14" fill="#b3e5fc" stroke="#0277bd" stroke-width="0.8"/>
    <rect x="44" y="10" width="14" height="14" fill="#b3e5fc" stroke="#0277bd" stroke-width="0.8"/>
    <!-- 屋根の頂上飾り -->
    <circle cx="0" cy="-58" r="2.5" fill="#fff8e1"/>
    <!-- 三角屋根の格子模様 -->
    <line x1="-25" y1="-27" x2="25" y2="-27" stroke="#5d0000" stroke-width="0.6" opacity="0.5"/>
    <line x1="-12" y1="-41" x2="12" y2="-41" stroke="#5d0000" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- 一橋大学 兼松講堂（市西部・ロマネスク様式・1927年） -->
  <g transform="translate(105, 295)">
    <!-- 鐘楼の塔 -->
    <rect x="-7" y="-50" width="14" height="35" fill="url(#kanematsuGrad)"/>
    <path d="M -10 -50 L 0 -62 L 10 -50 Z" fill="url(#kanematsuYaneGrad)"/>
    <!-- 講堂本体 -->
    <rect x="-30" y="-15" width="60" height="40" fill="url(#kanematsuGrad)"/>
    <!-- 半円アーチ屋根 -->
    <path d="M -30 -15 Q 0 -32 30 -15 Z" fill="url(#kanematsuYaneGrad)"/>
    <!-- ロマネスクアーチ窓 -->
    <path d="M -22 8 L -22 -3 Q -22 -8 -18 -8 Q -14 -8 -14 -3 L -14 8 Z" fill="#bbdefb"/>
    <path d="M -8 8 L -8 -3 Q -8 -8 -4 -8 Q 0 -8 0 -3 L 0 8 Z" fill="#bbdefb"/>
    <path d="M 6 8 L 6 -3 Q 6 -8 10 -8 Q 14 -8 14 -3 L 14 8 Z" fill="#bbdefb"/>
    <!-- 鐘楼の窓 -->
    <rect x="-3" y="-40" width="6" height="8" fill="#bbdefb"/>
  </g>

  <!-- 谷保天満宮 鳥居（市南部・東日本最古の天満宮・903年創建） -->
  <g transform="translate(405, 305)">
    <!-- 笠木（上部横木・反り） -->
    <path d="M -32 -28 Q 0 -34 32 -28 L 28 -25 Q 0 -30 -28 -25 Z" fill="url(#toriiGrad)"/>
    <!-- 島木 -->
    <rect x="-28" y="-23" width="56" height="3.5" fill="url(#toriiGrad)"/>
    <!-- 貫（中間横木） -->
    <rect x="-26" y="-10" width="52" height="3" fill="url(#toriiGrad)"/>
    <!-- 柱（2本） -->
    <rect x="-23" y="-22" width="4.5" height="38" fill="url(#toriiGrad)"/>
    <rect x="18.5" y="-22" width="4.5" height="38" fill="url(#toriiGrad)"/>
    <!-- 額束（中央の額） -->
    <rect x="-4" y="-19" width="8" height="6" fill="#ffd54f" stroke="#bf360c" stroke-width="0.5"/>
  </g>

  <!-- 大学通りの桜並木（市の象徴・1.2km） -->
  <!-- 左側 -->
  <g opacity="0.95">
    <line x1="195" y1="320" x2="195" y2="298" stroke="#5d4037" stroke-width="2.2"/>
    <circle cx="195" cy="290" r="10" fill="url(#sakuraGrad)"/>
    <circle cx="187" cy="285" r="7" fill="url(#sakuraGrad)"/>
    <circle cx="203" cy="285" r="7" fill="url(#sakuraGrad)"/>
  </g>
  <g opacity="0.95">
    <line x1="226" y1="320" x2="226" y2="300" stroke="#5d4037" stroke-width="2"/>
    <circle cx="226" cy="293" r="9" fill="url(#sakuraGrad)"/>
    <circle cx="220" cy="289" r="6" fill="url(#sakuraGrad)"/>
    <circle cx="232" cy="289" r="6" fill="url(#sakuraGrad)"/>
  </g>
  <!-- 右側 -->
  <g opacity="0.95">
    <line x1="288" y1="320" x2="288" y2="300" stroke="#5d4037" stroke-width="2"/>
    <circle cx="288" cy="293" r="9" fill="url(#sakuraGrad)"/>
    <circle cx="282" cy="289" r="6" fill="url(#sakuraGrad)"/>
    <circle cx="294" cy="289" r="6" fill="url(#sakuraGrad)"/>
  </g>
  <g opacity="0.95">
    <line x1="318" y1="320" x2="318" y2="298" stroke="#5d4037" stroke-width="2.2"/>
    <circle cx="318" cy="290" r="10" fill="url(#sakuraGrad)"/>
    <circle cx="310" cy="285" r="7" fill="url(#sakuraGrad)"/>
    <circle cx="326" cy="285" r="7" fill="url(#sakuraGrad)"/>
  </g>

  <!-- 散る桜の花びら -->
  <g opacity="0.85">
    <circle cx="160" cy="180" r="2.5" fill="#f8bbd0"/>
    <circle cx="240" cy="200" r="2" fill="#fce4ec"/>
    <circle cx="280" cy="175" r="2.5" fill="#f48fb1"/>
    <circle cx="350" cy="195" r="2" fill="#f8bbd0"/>
    <circle cx="125" cy="195" r="2" fill="#fce4ec"/>
    <circle cx="365" cy="220" r="2.5" fill="#f48fb1"/>
    <circle cx="205" cy="215" r="2" fill="#f8bbd0"/>
    <circle cx="190" cy="155" r="2" fill="#fce4ec"/>
    <circle cx="335" cy="160" r="2" fill="#f48fb1"/>
  </g>

  <!-- 立川崖線（ハケ）の崖の段差表現 -->
  <path d="M 0 320 Q 80 322 160 325 T 320 322 T 512 320 L 512 360 L 0 360 Z" fill="url(#hakeGrad)" opacity="0.95"/>
  <!-- 崖線のテクスチャ：等高線風 -->
  <path d="M 0 335 Q 100 332 200 336 T 400 333 T 512 336" fill="none" stroke="#1b5e20" stroke-width="1.2" opacity="0.5"/>
  <path d="M 0 350 Q 100 347 200 351 T 400 348 T 512 351" fill="none" stroke="#0d3d11" stroke-width="1.2" opacity="0.4"/>

  <!-- ママ下湧水（名水百選・市南部の崖下） -->
  <g transform="translate(155, 355)">
    <circle r="9" fill="url(#springGrad)" opacity="0.75"/>
    <circle r="15" fill="none" stroke="#0277bd" stroke-width="1.2" opacity="0.5"/>
    <circle r="21" fill="none" stroke="#0277bd" stroke-width="0.9" opacity="0.32"/>
    <circle r="26" fill="none" stroke="#0277bd" stroke-width="0.7" opacity="0.2"/>
  </g>

  <!-- 矢川緑地（東京都天然保護区域・市南西部） -->
  <g transform="translate(370, 358)">
    <ellipse cx="0" cy="0" rx="26" ry="9" fill="#aed581" opacity="0.92"/>
    <ellipse cx="-3" cy="-1" rx="18" ry="5" fill="none" stroke="#7cb342" stroke-width="0.8" opacity="0.55"/>
    <!-- 矢川の水面 -->
    <ellipse cx="0" cy="2" rx="20" ry="3" fill="#81d4fa" opacity="0.6"/>
  </g>

  <!-- 矢川（湧水流れ・市南部清流） -->
  <path d="M 0 380 Q 100 376 200 382 Q 256 386 312 382 Q 412 376 512 382" fill="none" stroke="url(#yagawaGrad)" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  <!-- 矢川のさざ波 -->
  <path d="M 30 384 q 18 -3 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.5"/>

  <!-- 多摩川（市南端・国立市・日野市境） -->
  <path d="M 0 410 Q 100 405 180 413 Q 256 420 332 413 Q 412 405 512 413" fill="none" stroke="url(#tamaGrad)" stroke-width="11" stroke-linecap="round"/>
  <!-- 多摩川のさざ波 -->
  <path d="M 50 415 q 18 -3 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.55"/>

  <!-- カワセミ（多摩川・矢川のシンボル） -->
  <g transform="translate(285, 398)">
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="#0288d1"/>
    <ellipse cx="-5" cy="-2" rx="4" ry="3.5" fill="#01579b"/>
    <circle cx="-7" cy="-3" r="0.9" fill="#fff"/>
    <path d="M -10 -3 L -13 -2.5 L -10 -1.5 Z" fill="#212121"/>
    <ellipse cx="3" cy="-1" rx="5" ry="2.5" fill="#0277bd"/>
    <ellipse cx="0" cy="1.5" rx="6" ry="2" fill="#ff7043"/>
  </g>

  <!-- 中央線の電車（市北端・国立駅を東西に貫く） -->
  <g transform="translate(256, 445)">
    <!-- 線路 -->
    <rect x="-220" y="14" width="440" height="2" fill="#5d4037" opacity="0.6"/>
    <rect x="-220" y="20" width="440" height="2" fill="#5d4037" opacity="0.6"/>
    <!-- 枕木 -->
    <g fill="#6d4c41" opacity="0.5">
      <rect x="-200" y="13" width="2" height="10"/>
      <rect x="-160" y="13" width="2" height="10"/>
      <rect x="-120" y="13" width="2" height="10"/>
      <rect x="-80" y="13" width="2" height="10"/>
      <rect x="-40" y="13" width="2" height="10"/>
      <rect x="0" y="13" width="2" height="10"/>
      <rect x="40" y="13" width="2" height="10"/>
      <rect x="80" y="13" width="2" height="10"/>
      <rect x="120" y="13" width="2" height="10"/>
      <rect x="160" y="13" width="2" height="10"/>
      <rect x="198" y="13" width="2" height="10"/>
    </g>
    <!-- 電車本体（オレンジ・中央線特快） -->
    <rect x="-60" y="-10" width="120" height="22" rx="4" ry="4" fill="url(#trainGrad)"/>
    <rect x="-60" y="-10" width="120" height="3" fill="#bf360c"/>
    <!-- 窓 -->
    <rect x="-52" y="-5" width="14" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <rect x="-32" y="-5" width="14" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <rect x="-12" y="-5" width="14" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <rect x="8" y="-5" width="14" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <rect x="28" y="-5" width="14" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <rect x="48" y="-5" width="10" height="9" fill="#bbdefb" stroke="#01579b" stroke-width="0.6"/>
    <!-- 車輪 -->
    <circle cx="-40" cy="13" r="4" fill="#212121"/>
    <circle cx="40" cy="13" r="4" fill="#212121"/>
    <!-- 中央線オレンジライン -->
    <rect x="-60" y="6" width="120" height="2" fill="#fff8e1" opacity="0.85"/>
  </g>

  <!-- 「国立」テキスト（最下段に小さく） -->
  <text x="256" y="488" font-family="M PLUS Rounded 1c, Hiragino Sans, sans-serif" font-size="22" font-weight="700" fill="#0d3a5a" text-anchor="middle" opacity="0.92">国立市</text>
</svg>
