<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 西東京市 高低マップ アイコン: 田無神社朱（五龍神）×武蔵野若葉緑×東伏見稲荷金 -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="0.55" stop-color="#ef9a9a"/>
      <stop offset="1" stop-color="#fff8e1"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb342"/>
      <stop offset="1" stop-color="#558b2f"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c62828"/>
      <stop offset="1" stop-color="#8d1f1f"/>
    </linearGradient>
  </defs>

  <!-- 背景：朱の円 -->
  <rect width="512" height="512" rx="96" fill="#c62828"/>

  <!-- 武蔵野空（朝焼け） -->
  <rect x="36" y="40" width="440" height="280" rx="32" fill="url(#skyGrad)"/>

  <!-- 武蔵野台地（地形） -->
  <path d="M36 320 Q 130 270 230 290 T 476 280 L 476 432 L 36 432 Z" fill="url(#groundGrad)"/>

  <!-- スカイタワー西東京（田無タワー・高さ195m）中央 -->
  <g>
    <!-- タワー脚部 -->
    <polygon points="240,330 272,330 264,180 248,180" fill="url(#towerGrad)"/>
    <!-- 展望部 -->
    <ellipse cx="256" cy="180" rx="22" ry="14" fill="#f9a825"/>
    <!-- アンテナ -->
    <line x1="256" y1="170" x2="256" y2="120" stroke="#fff8e1" stroke-width="4" stroke-linecap="round"/>
    <circle cx="256" cy="118" r="6" fill="#fff8e1"/>
  </g>

  <!-- 田無神社 鳥居（左） -->
  <g stroke="#c62828" stroke-width="6" fill="#c62828">
    <line x1="100" y1="262" x2="100" y2="330" stroke-width="8"/>
    <line x1="160" y1="262" x2="160" y2="330" stroke-width="8"/>
    <rect x="86" y="240" width="88" height="12" rx="2"/>
    <rect x="94" y="262" width="72" height="6"/>
  </g>

  <!-- 東伏見稲荷 千本鳥居（右・連続鳥居） -->
  <g fill="#f9a825">
    <rect x="332" y="278" width="6" height="52"/>
    <rect x="358" y="272" width="6" height="58"/>
    <rect x="384" y="266" width="6" height="64"/>
    <rect x="410" y="260" width="6" height="70"/>
    <rect x="436" y="254" width="6" height="76"/>
    <rect x="326" y="276" width="20" height="6"/>
    <rect x="352" y="270" width="20" height="6"/>
    <rect x="378" y="264" width="20" height="6"/>
    <rect x="404" y="258" width="20" height="6"/>
    <rect x="430" y="252" width="20" height="6"/>
  </g>

  <!-- 五龍神（金龍シルエット） -->
  <g fill="#f9a825" opacity="0.85">
    <path d="M180 410 Q 220 380 256 400 Q 292 420 332 400 Q 360 388 380 408" stroke="#f9a825" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="180" cy="410" r="5"/>
  </g>

  <!-- 標高ラベル -->
  <text x="256" y="478" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff8e1" text-anchor="middle" letter-spacing="2">西東京 高低</text>
</svg>
