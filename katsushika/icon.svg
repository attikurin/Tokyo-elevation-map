<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="葛飾高低マップ アイコン">
  <title>葛飾 高低マップ</title>
  <defs>
    <!-- 朝空グラデーション（水元公園の朝・帝釈天の参道空） -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#c8e6c9"/>
      <stop offset="55%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <!-- 江戸川（区の東境界・矢切の渡し） -->
    <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <!-- 帝釈天の杜（柴又緑・水元の森） -->
    <linearGradient id="forestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <!-- 堀切菖蒲園の花菖蒲（菖蒲紫） -->
    <linearGradient id="irisGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ba68c8"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <!-- 寅さんの中折帽の黄色・両さん・キャプテン翼 -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </linearGradient>
    <!-- 若葉背景（水元公園の新緑） -->
    <radialGradient id="paperGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%"  stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </radialGradient>
  </defs>

  <!-- 背景（若葉色） -->
  <rect width="512" height="512" rx="96" fill="url(#paperGrad)"/>

  <!-- 朝空 -->
  <rect x="32" y="56" width="448" height="200" rx="14" fill="url(#skyGrad)"/>

  <!-- 朝日 -->
  <circle cx="100" cy="118" r="32" fill="#fff59d" opacity="0.95"/>
  <circle cx="100" cy="118" r="32" fill="none" stroke="#fff59d" stroke-width="2" opacity="0.7"/>

  <!-- 雲 -->
  <ellipse cx="180" cy="100" rx="34" ry="10" fill="#fff" opacity="0.85"/>
  <ellipse cx="220" cy="110" rx="28" ry="9" fill="#fff" opacity="0.75"/>

  <!-- 柴又帝釈天 二天門（葛飾区最大のシンボル・柴又7-10-3・寅さんゆかり） -->
  <g transform="translate(300,120)">
    <!-- 屋根（瓦色） -->
    <polygon points="-50,40 50,40 40,20 -40,20" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
    <polygon points="-40,20 40,20 30,4 -30,4" fill="#6d4c41" stroke="#3e2723" stroke-width="1.5"/>
    <!-- 鯱（金色） -->
    <polygon points="-30,4 -32,-6 -28,-6" fill="url(#goldGrad)"/>
    <polygon points="30,4 32,-6 28,-6" fill="url(#goldGrad)"/>
    <!-- 二天門 柱 -->
    <rect x="-46" y="40" width="6" height="60" fill="#8d6e63" stroke="#3e2723" stroke-width="1"/>
    <rect x="40" y="40" width="6" height="60" fill="#8d6e63" stroke="#3e2723" stroke-width="1"/>
    <!-- 門扉 -->
    <rect x="-40" y="50" width="80" height="40" fill="#fff8e1" stroke="#3e2723" stroke-width="1"/>
    <line x1="0" y1="50" x2="0" y2="90" stroke="#3e2723" stroke-width="1"/>
    <!-- 二天像（仁王様） -->
    <circle cx="-20" cy="68" r="6" fill="#6d4c41"/>
    <circle cx="20" cy="68" r="6" fill="#6d4c41"/>
    <!-- 額（題経寺） -->
    <rect x="-20" y="24" width="40" height="14" fill="#fff8e1" stroke="#3e2723" stroke-width="1"/>
    <text x="0" y="35" text-anchor="middle" font-family="serif" font-size="9" font-weight="900" fill="#1b5e20">帝釈天</text>
  </g>

  <!-- 江戸川（区の東境界・縦に流れる・矢切の渡し） -->
  <path d="M 440 56 Q 470 200 460 340 Q 450 420 470 480 L 480 480 L 480 56 Z" fill="url(#riverGrad)" opacity="0.85"/>
  <!-- 川面の波 -->
  <path d="M 450 180 q 6 -3 12 0 q 6 -3 12 0" fill="none" stroke="#bbdefb" stroke-width="2" opacity="0.8"/>
  <path d="M 450 240 q 6 -3 12 0 q 6 -3 12 0" fill="none" stroke="#bbdefb" stroke-width="2" opacity="0.8"/>
  <path d="M 450 300 q 6 -3 12 0 q 6 -3 12 0" fill="none" stroke="#bbdefb" stroke-width="2" opacity="0.8"/>
  <path d="M 450 360 q 6 -3 12 0 q 6 -3 12 0" fill="none" stroke="#bbdefb" stroke-width="2" opacity="0.8"/>

  <!-- 矢切の渡し（江戸川の渡し舟・葛飾柴又〜松戸） -->
  <g transform="translate(450,250)">
    <ellipse cx="0" cy="0" rx="14" ry="4" fill="#8d6e63" stroke="#3e2723" stroke-width="1"/>
    <line x1="0" y1="-2" x2="0" y2="-14" stroke="#3e2723" stroke-width="1.5"/>
    <polygon points="0,-14 10,-10 0,-4" fill="#fff8e1" stroke="#3e2723" stroke-width="0.8"/>
  </g>

  <!-- 中川（区を東西に二分する川） -->
  <path d="M 40 56 Q 80 180 100 340 Q 110 420 90 480 L 50 480 L 40 480 Z" fill="url(#riverGrad)" opacity="0.7"/>
  <path d="M 55 240 q 6 -3 12 0 q 6 -3 12 0" fill="none" stroke="#bbdefb" stroke-width="1.5" opacity="0.8"/>
  <path d="M 65 320 q 6 -3 12 0 q 6 -3 12 0" fill="none" stroke="#bbdefb" stroke-width="1.5" opacity="0.8"/>

  <!-- 水元公園の森（葛飾区最大の都立公園・約96ha・葛飾の水と緑） -->
  <g transform="translate(140,180)" opacity="0.92">
    <ellipse cx="0" cy="0" rx="28" ry="20" fill="url(#forestGrad)"/>
    <line x1="0" y1="18" x2="0" y2="38" stroke="#3e2723" stroke-width="2.5"/>
    <!-- 水辺 -->
    <ellipse cx="-5" cy="42" rx="20" ry="4" fill="url(#riverGrad)" opacity="0.7"/>
  </g>
  <g transform="translate(210,200)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="22" ry="16" fill="url(#forestGrad)"/>
    <line x1="0" y1="14" x2="0" y2="30" stroke="#3e2723" stroke-width="2"/>
  </g>

  <!-- 堀切菖蒲園（花菖蒲・葛飾の花の名所・堀切2-19-1） -->
  <g transform="translate(140,300)" opacity="0.9">
    <!-- 池 -->
    <ellipse cx="0" cy="20" rx="50" ry="12" fill="url(#riverGrad)" opacity="0.6"/>
    <!-- 菖蒲の花（紫） -->
    <g transform="translate(-30,12)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#388e3c" stroke-width="1.5"/>
      <ellipse cx="0" cy="-4" rx="5" ry="6" fill="url(#irisGrad)"/>
    </g>
    <g transform="translate(-10,15)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#388e3c" stroke-width="1.5"/>
      <ellipse cx="0" cy="-3" rx="4" ry="5" fill="url(#irisGrad)"/>
    </g>
    <g transform="translate(10,12)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#388e3c" stroke-width="1.5"/>
      <ellipse cx="0" cy="-4" rx="5" ry="6" fill="url(#irisGrad)"/>
    </g>
    <g transform="translate(30,15)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#388e3c" stroke-width="1.5"/>
      <ellipse cx="0" cy="-3" rx="4" ry="5" fill="url(#irisGrad)"/>
    </g>
  </g>

  <!-- 寅さんの中折帽（柴又のシンボル・葛飾区民の誇り） -->
  <g transform="translate(380,380)">
    <!-- ツバ -->
    <ellipse cx="0" cy="0" rx="36" ry="6" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
    <!-- クラウン -->
    <path d="M -22 0 Q -24 -22 0 -22 Q 24 -22 22 0 Z" fill="url(#goldGrad)" stroke="#3e2723" stroke-width="1.5"/>
    <!-- リボン -->
    <rect x="-22" y="-6" width="44" height="3" fill="#5d4037"/>
    <!-- 中央のくぼみ -->
    <line x1="0" y1="-22" x2="0" y2="-8" stroke="#3e2723" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 葛飾区の標高線（東京低地・葛飾区は大部分が海抜0〜3m） -->
  <path d="M 110 350 Q 250 340 450 350" fill="none" stroke="#2e7d32" stroke-width="2" opacity="0.4"/>
  <path d="M 110 365 Q 250 355 450 365" fill="none" stroke="#2e7d32" stroke-width="2" opacity="0.3"/>

  <!-- ピン（葛飾区役所＝立石5-13-1） -->
  <g transform="translate(256,420)">
    <path d="M 0 0 C -30 -50 30 -50 0 0 Z M 0 -28 C -16 -28 -16 -44 0 -44 C 16 -44 16 -28 0 -28 Z" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
    <circle cx="0" cy="-38" r="6" fill="#fff8e1"/>
  </g>

  <!-- タイトル枠 -->
  <rect x="56" y="448" width="400" height="56" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="256" y="481" text-anchor="middle" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="26" font-weight="900" fill="#2e7d32" letter-spacing="6">葛飾 高低</text>
  <text x="256" y="499" text-anchor="middle" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="11" fill="#1b5e20" letter-spacing="2">SHIBAMATA・MIZUMOTO・KAMEARI</text>
</svg>
