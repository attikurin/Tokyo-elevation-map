<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 隅田川ブルー × 銀座ゴールド × 日本橋朱 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fa6d6"/>
      <stop offset="60%" stop-color="#0277bd"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe082" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#fbc02d" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <!-- 隅田川 -->
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 月 -->
  <circle cx="105" cy="105" r="30" fill="#ffe082" opacity="0.95"/>
  <circle cx="115" cy="100" r="25" fill="#0277bd" opacity="0.85"/>

  <!-- 星 -->
  <circle cx="370" cy="75" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="420" cy="115" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="345" cy="135" r="2" fill="#fff" opacity="0.8"/>

  <!-- 隅田川（右下から左上に流れる帯） -->
  <path d="M0,440 Q120,420 256,432 T512,420 L512,470 Q256,485 0,470 Z"
        fill="url(#river)" opacity="0.9"/>
  <!-- 川面の光 -->
  <path d="M0,448 Q120,440 256,448 T512,440" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M40,460 Q180,452 320,460 T500,455" stroke="#fff" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- 日本橋（朱色のアーチ橋）— 左寄り -->
  <g>
    <!-- 橋脚 -->
    <rect x="50" y="380" width="8" height="50" fill="#c62828"/>
    <rect x="140" y="380" width="8" height="50" fill="#c62828"/>
    <!-- アーチ -->
    <path d="M40,395 Q100,355 158,395" stroke="#c62828" stroke-width="10" fill="none"/>
    <!-- 橋の柱頭飾り（擬宝珠） -->
    <circle cx="54" cy="378" r="6" fill="#fbc02d"/>
    <circle cx="144" cy="378" r="6" fill="#fbc02d"/>
    <!-- 橋面 -->
    <rect x="38" y="390" width="124" height="6" fill="#8d2929"/>
  </g>

  <!-- 銀座方面のビル群（中央〜右寄り） -->
  <!-- 中央の高層ビル（中央区役所イメージ） -->
  <rect x="200" y="200" width="48" height="220" fill="url(#bldg)"/>
  <!-- 隣のビル -->
  <rect x="256" y="240" width="36" height="180" fill="url(#bldg)"/>
  <rect x="300" y="220" width="40" height="200" fill="url(#bldg)"/>
  <rect x="348" y="260" width="32" height="160" fill="url(#bldg)"/>
  <!-- 月島・勝どきタワー群（右端） -->
  <rect x="388" y="180" width="32" height="240" fill="url(#bldg)"/>
  <rect x="428" y="220" width="32" height="200" fill="url(#bldg)"/>

  <!-- 銀座の看板（中央のゴールドサイン） -->
  <rect x="200" y="190" width="48" height="22" rx="3" fill="#fbc02d"/>
  <text x="224" y="207" font-family="sans-serif" font-size="13" font-weight="bold"
        text-anchor="middle" fill="#0277bd">中央</text>

  <!-- ビルの窓（ゴールド点灯） -->
  <g fill="url(#window)" opacity="0.95">
    <!-- 中央ビル -->
    <rect x="208" y="225" width="6" height="6"/>
    <rect x="220" y="225" width="6" height="6"/>
    <rect x="232" y="225" width="6" height="6"/>
    <rect x="208" y="245" width="6" height="6"/>
    <rect x="220" y="245" width="6" height="6"/>
    <rect x="232" y="245" width="6" height="6"/>
    <rect x="208" y="275" width="6" height="6"/>
    <rect x="232" y="275" width="6" height="6"/>
    <rect x="208" y="305" width="6" height="6"/>
    <rect x="220" y="305" width="6" height="6"/>
    <rect x="232" y="305" width="6" height="6"/>
    <rect x="208" y="335" width="6" height="6"/>
    <rect x="232" y="335" width="6" height="6"/>
    <rect x="208" y="365" width="6" height="6"/>
    <rect x="220" y="365" width="6" height="6"/>
    <rect x="232" y="365" width="6" height="6"/>

    <!-- 周辺ビル群 -->
    <rect x="262" y="260" width="5" height="5"/>
    <rect x="274" y="260" width="5" height="5"/>
    <rect x="284" y="260" width="5" height="5"/>
    <rect x="262" y="290" width="5" height="5"/>
    <rect x="284" y="290" width="5" height="5"/>
    <rect x="262" y="320" width="5" height="5"/>
    <rect x="274" y="320" width="5" height="5"/>
    <rect x="284" y="320" width="5" height="5"/>

    <rect x="306" y="240" width="5" height="5"/>
    <rect x="318" y="240" width="5" height="5"/>
    <rect x="330" y="240" width="5" height="5"/>
    <rect x="306" y="270" width="5" height="5"/>
    <rect x="330" y="270" width="5" height="5"/>
    <rect x="306" y="300" width="5" height="5"/>
    <rect x="318" y="300" width="5" height="5"/>
    <rect x="330" y="300" width="5" height="5"/>
    <rect x="306" y="350" width="5" height="5"/>
    <rect x="330" y="350" width="5" height="5"/>

    <rect x="354" y="280" width="5" height="5"/>
    <rect x="366" y="280" width="5" height="5"/>
    <rect x="354" y="310" width="5" height="5"/>
    <rect x="366" y="310" width="5" height="5"/>
    <rect x="354" y="340" width="5" height="5"/>
    <rect x="366" y="340" width="5" height="5"/>

    <!-- 月島・勝どきタワー -->
    <rect x="394" y="200" width="5" height="5"/>
    <rect x="406" y="200" width="5" height="5"/>
    <rect x="394" y="230" width="5" height="5"/>
    <rect x="406" y="230" width="5" height="5"/>
    <rect x="394" y="260" width="5" height="5"/>
    <rect x="406" y="260" width="5" height="5"/>
    <rect x="394" y="290" width="5" height="5"/>
    <rect x="406" y="290" width="5" height="5"/>
    <rect x="394" y="320" width="5" height="5"/>
    <rect x="406" y="320" width="5" height="5"/>
    <rect x="394" y="350" width="5" height="5"/>
    <rect x="406" y="350" width="5" height="5"/>

    <rect x="434" y="240" width="5" height="5"/>
    <rect x="446" y="240" width="5" height="5"/>
    <rect x="434" y="270" width="5" height="5"/>
    <rect x="446" y="270" width="5" height="5"/>
    <rect x="434" y="300" width="5" height="5"/>
    <rect x="446" y="300" width="5" height="5"/>
    <rect x="434" y="330" width="5" height="5"/>
    <rect x="446" y="330" width="5" height="5"/>
    <rect x="434" y="360" width="5" height="5"/>
    <rect x="446" y="360" width="5" height="5"/>
  </g>

  <!-- 提灯（日本橋たもとの和の灯） -->
  <circle cx="100" cy="370" r="6" fill="#fbc02d" opacity="0.95"/>
  <rect x="99" y="364" width="2" height="3" fill="#8d2929"/>
  <circle cx="100" cy="370" r="8" fill="#fbc02d" opacity="0.3"/>

  <!-- 街灯の光 -->
  <circle cx="180" cy="410" r="2.5" fill="#fff" opacity="0.85"/>
  <circle cx="375" cy="408" r="2.5" fill="#ffe082" opacity="0.85"/>
</svg>
